<html lang="es">
<head>
<meta charset="utf-8">

<title>Finanzas 4B205</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec;
  --accent:#2f6fde; --accent-soft:#e8f0fd; --pos:#1f8a4c; --neg:#c93a3a; --warn:#b7791f; --warn-soft:#fdf5e6;
  --radius:10px;
  /* paleta categórica validada (orden fijo) + barras de saldo (azul/rojo) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s-other:#898781;
  --bar-pos:#2a78d6; --bar-neg:#e34948; --grid:#e8e9ed; --axis:#c3c2b7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171d; --panel:#1c2028; --text:#e6e8ec; --muted:#9aa1b0; --line:#2c323d;
    --accent:#6b9cf5; --accent-soft:#22304a; --pos:#4cc483; --neg:#f07272; --warn:#e0a84a; --warn-soft:#3a2f1c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --bar-pos:#3987e5; --bar-neg:#e66767; --grid:#262b34; --axis:#3a404b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:17px;margin:0 8px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
#fileStatus{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
main{max-width:1400px;margin:0 auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.toolbar.sub{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;flex:1;min-width:0}
.filters > *{width:100%;min-width:0;height:34px}
.filters > input{grid-column:span 2}
@media (max-width:520px){ .filters{grid-template-columns:1fr 1fr} }
/* estados (siempre con ícono + texto) */
.status{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.status.good{background:rgba(12,163,12,.12);color:#0a7d0a}
.status.warn{background:rgba(250,178,25,.18);color:#8a5d00}
.status.crit{background:rgba(208,59,59,.12);color:#b52f2f}
@media (prefers-color-scheme: dark){ .status.good{color:#4cc483} .status.warn{color:#f3c35a} .status.crit{color:#f07272} }
/* presupuesto */
.bud-legend{display:flex;gap:14px;margin:4px 0 8px}
.bud-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--muted)}
.sw.soft{opacity:.3} .sw.mark{width:2px;height:12px;background:var(--text)}
.bud-rows{display:grid;gap:2px}
.bud-row{display:grid;grid-template-columns:180px minmax(120px,1fr) 230px 90px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.bud-row:last-child{border-bottom:0}
.bud-name{font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-name i,i.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;margin-right:6px}
.bud-name i{margin-right:0}
.bud-bar{position:relative;height:14px;background:var(--grid);border-radius:4px}
.bud-bar .soft,.bud-bar .solid{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bud-bar .soft{opacity:.3}
.bud-bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);margin-left:-1px;border-radius:1px}
.bud-num{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){ .bud-row{grid-template-columns:1fr auto} .bud-bar{grid-column:1 / -1;order:3} .bud-num{grid-column:1 / -1;order:4} }
/* viajes */
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.trip-grid .panel{margin:0}
.panel.trip{cursor:pointer;transition:border-color .15s}
.panel.trip:hover{border-color:var(--accent)}
.panel.trip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.trip .loc{margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.mini-bars{display:grid;gap:5px;margin-top:10px}
.mb{display:grid;grid-template-columns:100px 1fr 80px;gap:8px;align-items:center;font-size:12px}
.mb > div{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--bar-pos);border-radius:4px}
.mb .num{text-align:right;font-variant-numeric:tabular-nums}
#tripList{margin-top:16px}
.stop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.stop > div{flex:1;min-width:140px}
.city-hint{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;background:var(--accent-soft);border-radius:8px;padding:6px 8px;margin:6px 0}
.city-hint .icon{margin-left:auto}
.city-sug{margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.city-sug:empty{display:none}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.geo-res{display:grid;gap:4px;max-height:220px;overflow:auto}
.geo-opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit;color:var(--text);cursor:pointer}
.geo-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.leaflet-container{font:inherit}
#reportView{position:fixed;inset:0;z-index:1500;background:rgba(20,23,29,.6);display:flex;flex-direction:column}
#reportView .rv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:10px 16px;border-bottom:1px solid var(--line)}
#reportView iframe{flex:1;border:0;background:#eef0f4;width:100%}
#tabPaused{position:fixed;inset:0;z-index:2000;background:rgba(20,23,29,.55);display:flex;align-items:center;justify-content:center;padding:16px}
/* planificar */
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line)}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.st-pres{--st:#898781} .st-res{--st:#eda100} .st-pag{--st:#1baf7a}
.stbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--grid);margin-top:10px}
.stbar i{display:block;height:100%;background:var(--st)}
.stleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.stleg span{display:inline-flex;align-items:center;gap:4px}
.stleg i{width:8px;height:8px;border-radius:2px;background:var(--st);display:inline-block}
select.stsel{border-left:4px solid var(--st);font-size:12px;padding:3px 6px}
.opt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.opt-card{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.opt-card.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt-grid.wide{grid-template-columns:1fr}
.opt-grid label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.opt-grid input{width:100%;min-width:0}
table.cmp tr.on td{background:var(--accent-soft);font-weight:600}
#planMap{position:relative;z-index:0;isolation:isolate}
/* resumen del plan: dos columnas independientes (sin huecos entre paneles de distinta altura) */
.stop{flex-wrap:wrap}
.stop-lodg{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.stop-lodg:empty{display:none}
.lodg-chip{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--st, var(--line));border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.lodg-chip:hover{background:var(--accent-soft)}
.lodg-chip.undec{border-left-color:#eda100;background:#fff8e6;color:#1d2330}
.lodg-chip.warn{border-left-color:var(--neg);border-style:dashed;color:var(--neg)}
.lodg-chip .st-txt{color:var(--muted)}
.sum-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.sum-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sum-col .panel{margin:0}
@media (max-width:900px){ .sum-cols{grid-template-columns:1fr} }
.mb-total{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.mini-bars .mb.mb-total > div{background:none}
@media (min-width:901px){ .sum-col:last-child{position:sticky;top:76px} }
.pend-group + .pend-group{margin-top:12px}
.pend-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.pend-row{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:7px 4px;font:inherit;color:var(--text);text-align:left;cursor:pointer;border-radius:4px}
.pend-row:hover{background:var(--accent-soft)}
#planMap.labels .pin .lbl{display:block}
#planMap.labels .pin.nolbl .lbl{display:none}
.leg-lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(255,255,255,.95);color:#1d2330;border:1px solid rgba(0,0,0,.15);
  border-radius:99px;padding:1px 7px;font-size:11px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
.leg-lbl.undec{border:1.5px dashed #b7791f;background:#fff8e6}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.map-legend .lg-dot{display:inline-block;width:18px;height:0;border-top:2px dotted var(--text);vertical-align:middle}
.prop-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.prop-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;color:var(--text);cursor:pointer;text-align:left}
.prop-chip.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.prop-act{display:flex;gap:6px;align-items:center;margin-left:auto}
.pp-chips{display:inline-flex;gap:8px}
tr.sel-row td{background:var(--accent-soft)}
@media (max-width:600px){
  dialog{min-width:0;width:calc(100vw - 16px);max-width:calc(100vw - 16px);padding:14px}
  dialog form{width:100% !important}
  dialog .row .field{flex:1 1 140px;min-width:0}
  dialog .row .field input, dialog .row .field select{width:100%}
  .opt-grid{grid-template-columns:1fr}
}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-radius:8px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
dialog .row .field{flex:none}
/* para revisar */
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--neg);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;vertical-align:1px}
nav .badge{margin-left:2px}
.rev{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0}
.rev-txt{flex:1;min-width:240px}
.rev-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* el mapa crea capas con z-index altos: se aísla para que no tape el menú fijo al hacer scroll */
#tripMap{position:relative;z-index:0;isolation:isolate}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;pointer-events:auto;transition:opacity .15s}
.pin .dot{flex:none;width:18px;height:18px;border-radius:50%;background:#2a78d6;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
  color:#fff;font:700 10px/14px system-ui,sans-serif;text-align:center;cursor:pointer}
.pin.prop .dot{border-style:dashed;opacity:.7}
.tcolor{width:22px;height:22px;padding:0;border:0;border-radius:6px;background:none;cursor:pointer;flex:none}
.tcolor::-webkit-color-swatch-wrapper{padding:0}.tcolor::-webkit-color-swatch{border:1px solid var(--line);border-radius:6px}
.mini-bars.big .mb{grid-template-columns:120px 1fr 140px;font-size:13px}
.mini-bars.big .mb > div{height:10px}
.top-ex{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.top-ex:first-of-type{border-top:0}
.trip-detail .kpis{margin-bottom:0}
.pin.sel .dot{width:22px;height:22px;line-height:18px;box-shadow:0 0 0 3px rgba(42,120,214,.35),0 1px 4px rgba(0,0,0,.35)}
.pin .lbl{display:none;position:absolute;left:22px;white-space:nowrap;background:rgba(255,255,255,.94);color:#1d2330;border:1px solid rgba(0,0,0,.12);
  border-radius:6px;padding:1px 6px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.pin .lbl b{font-weight:600}
#tripMap.labels .pin .lbl{display:block}
#tripMap .pin.nolbl .lbl{display:none}
#tripMap.hl .pin:not(.on){opacity:.25}
#tripMap.hl .pin.on{z-index:1000}
table.beca th, table.beca td{padding:5px 6px}
table.beca td .tag{display:block;width:max-content;margin-top:2px}
table.beca input{padding:4px 6px}
table.beca input::-webkit-inner-spin-button{display:none}
table.beca th.grp{text-align:center;color:var(--text);border-bottom:1px solid var(--line)}
table.beca thead tr:nth-child(2) th{top:29px}
table.beca .sep{border-left:1px solid var(--line)}
td.desc{white-space:normal;min-width:180px;max-width:340px}
td.desc .orig{display:block;font-size:12px;color:var(--muted)}
td select{padding:3px 6px;font-size:13px}
.toolbar > .btn{height:34px;white-space:nowrap}
label.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.small-btn{padding:4px 10px;font-size:12px}
@media (max-width:600px){ .toolbar > .btn{width:100%} }
.muted{color:var(--muted)} .small{font-size:12px}
button.btn,label.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;display:inline-block}
button.btn.sec,label.btn.sec{background:var(--accent-soft);color:var(--accent)}
button.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
button.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px}
button.icon:hover{background:var(--accent-soft);color:var(--accent)}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
input[type=number]{width:90px}
.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:12px;color:var(--muted);z-index:1}
td.num,th.num{text-align:right}
tr.total td{font-weight:700;background:var(--accent-soft)}
tr.sub td{color:var(--muted);font-style:italic}
td.click{cursor:pointer} td.click:hover{background:var(--accent-soft);color:var(--accent)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
#drop{border:2px dashed var(--line);border-radius:var(--radius);padding:36px;text-align:center;color:var(--muted);cursor:pointer}
#drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);padding:20px;min-width:340px;max-width:92vw}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px}
dialog .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.grid2 > *{min-width:0}
@media (max-width:700px){
  header{padding:10px 12px;gap:8px}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav button{white-space:nowrap;flex:none}
  #fileStatus{margin-left:auto}
}
/* tablas anchas: la primera columna queda fija al scrollear de costado */
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;box-shadow:inset -1px 0 0 var(--line)}
.sticky1 thead th:first-child{z-index:2}
.sticky1 tr.total td:first-child{background:var(--accent-soft)}
svg text{fill:var(--muted);font-size:11px}
svg text.tot{fill:var(--text);font-weight:600}
svg text.tot.over{fill:var(--neg)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.seg{transition:opacity .12s}
.chart.dim .seg:not(.on){opacity:.28}
.legend button{background:none;border:1px solid transparent;border-radius:99px;padding:2px 8px;font:inherit;font-size:12px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.legend button:hover{border-color:var(--line)}
.legend button.off{opacity:.4}
.legend button.sel{border-color:var(--accent);background:var(--accent-soft)}
.legend .swl{width:16px;height:0;border-top:2px dashed var(--text);opacity:.6;display:inline-block}
.legend .swline{width:16px;height:2px;background:var(--text);display:inline-block;position:relative}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.16);padding:10px 12px;font-size:12px;min-width:220px;display:none;font-variant-numeric:tabular-nums}

<script>
'use strict';
/* =========================================================
   Estado y valores por defecto (tomados del Excel)
   ========================================================= */
const STORAGE_KEY = 'finanzas4b205.v1';

const DEFAULT_STATE = () => ({
  version: 1,
  savedAt: 0,
  people: [
    // los alias (nombres completos en Splitwise) se cargan en Configuración y viajan en el archivo de datos, no en el código
    { id: 'FRANCO', name: 'Franco', aliases: [], keyword: 'franco' },
    { id: 'NOAH',   name: 'Noah',   aliases: [], keyword: 'noah' },
  ],
  simpCats: ['Vivienda y Fijos','Supermercado','Salidas y Ocio','Transporte','Articulos de Hogar','Extraordinarias','Viajes','Otros','Pagos','Descarte'],
  excludedCats: ['Pagos','Descarte'],
  catMap: {
    'Location':'Vivienda y Fijos','TV/Téléphone/Internet':'Vivienda y Fijos','Services':'Vivienda y Fijos',
    'Courses':'Supermercado','Nourriture et boissons - Autre':'Supermercado',
    'Alcool':'Salidas y Ocio','Sorties':'Salidas y Ocio','Musique':'Salidas y Ocio','Loisirs - Autre':'Salidas y Ocio',
    'Bus/train':'Transporte','Taxi':'Transporte',
    'Meubles':'Articulos de Hogar',
    'Cadeaux':'Extraordinarias','Vêtements':'Extraordinarias',
    'Paiement':'Pagos',
  },
  groups: [
    { prefix:'4b205', origin:'4B205', trip:false },
  ],
  rates: { EUR: 1, ARS: 1650, USD: 1.16 },   // unidades de moneda por 1 EUR
  puchoPrecio: 7,
  beca: {},       // mes -> { base, puchos, ajuste } (se carga en la pestaña Beca y saldo)
  expenses: [],
  overrides: {},
  imports: {},
  budgets: {},    // persona -> categoría -> monto mensual
  trips: {},      // origen -> { stops: [{name, lat, lon, from, to, match}], confirmed }
  tripCities: {}, // origen -> ciudades detectadas en las descripciones
  tripColors: {}, // origen -> color del viaje (editable)
  seenFiles: {},   // nombre de CSV -> lastModified ya procesado desde la carpeta
  reviewIgnored: {}, // pendientes de "Para revisar" que se decidió dejar como están
  ignoredDups: [],   // pares de grupos que NO son el mismo
  plans: {},         // planes de viaje (Planificar)
});

let S = load();
let view = 'resumen';
const ui = { person: 'FRANCO', year: 'all', budgetWin: 12, budgetMethod: 'p90', trip: { from:'', to:'', origin:'', stop:'', person:'ALL' }, plan: { id:'', tab:'resumen' }, filters: { month:'', origin:'', simp:'', q:'', person:'', onlyIssues:false, showExcluded:false } };

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch(e){ console.error(e); }
  return DEFAULT_STATE();
}
function migrate(s){
  const d = DEFAULT_STATE();
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  return s;
}
let saveTimer = null;
function save(){
  if (typeof tabActive !== 'undefined' && !tabActive){ toast('Esta pestaña está pausada: usá la otra pestaña de la app'); return; }
  S.savedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e){ toast('No se pudo guardar en el navegador: ' + e.message); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeDataFile, 600);
}

/* =========================================================
   Utilidades
   ========================================================= */
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmtE = new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always' });
const eur = n => (n == null || isNaN(n)) ? '' : fmtE.format(n);
const eur0 = n => (!n || Math.abs(n) < 0.005) ? '<span class="muted">–</span>' : eur(n);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const monthLabel = m => { const [y,mm] = m.split('-'); return `${MESES[+mm-1]} ${y}`; };
const monthOf = d => d.slice(0,7);
function monthRange(a, b){ const out=[]; let [y,m]=a.split('-').map(Number); const [yb,mb]=b.split('-').map(Number);
  while (y<yb || (y===yb && m<=mb)) { out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){m=1;y++;} } return out; }
const currentMonth = () => new Date().toISOString().slice(0,7);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 3200); }
// El color sigue a la categoría (posición fija en la lista), nunca se recicla: de la 9ª en adelante, gris.
const catColor = c => { const i = spendCats().indexOf(c); return i >= 0 && i < 8 ? `var(--s${i+1})` : 'var(--s-other)'; };
const fmt0 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0, useGrouping: 'always' });
const eurShort = n => Math.abs(n) >= 10000 ? fmt0.format(n/1000) + 'k' : fmt0.format(n);

/* =========================================================
   CSV de Splitwise
   ========================================================= */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows=[]; let row=[], field='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(field); field=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if (field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function prefixFromFilename(name){
  return name.toLowerCase().replace(/\.csv$/,'').replace(/(_\d{4}-\d{2}-\d{2})?_export.*$/,'').trim();
}

function personForColumn(col){
  const c = col.trim().toLowerCase();
  const p = S.people.find(p => p.aliases.some(a => a.trim().toLowerCase() === c));
  return p ? p.id : null;
}

/* Misma lógica que la fórmula del Excel:
   saldo > 0  -> pagó todo, su parte = costo - saldo
   saldo < 0  -> no pagó, su parte = |saldo|
   saldo = 0  -> si la descripción lo nombra, todo; si no, 0
   Si es el único miembro del grupo, su parte es el costo. */
function shareFor(balance, cost, desc, person, memberCount){
  if (memberCount === 1) return cost;
  if (balance > 0) return r2(cost - balance);
  if (balance < 0) return r2(Math.abs(balance));
  return desc.toLowerCase().includes(person.keyword.toLowerCase()) ? cost : 0;
}

function parseSplitwise(text){
  const rows = parseCSV(text).filter(r => r.some(x => x.trim() !== ''));
  if (!rows.length) throw new Error('El archivo está vacío');
  const header = rows[0];
  if (header.length < 6) throw new Error('No parece un CSV exportado de Splitwise');
  const memberCols = header.slice(5).map((name, i) => ({ name, idx: i+5, person: personForColumn(name) }));
  const out = [];
  const seen = {};
  for (const r of rows.slice(1)){
    const [date, desc, cat, costS, cur] = r.map(x => (x ?? '').trim());
    const cost = parseFloat(costS);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(cost)) continue;      // salta "Solde total" y filas raras
    const raw = {}, shares = {};
    for (const m of memberCols){
      const b = parseFloat(r[m.idx]) || 0;
      if (m.person){
        const p = S.people.find(p => p.id === m.person);
        raw[m.person] = b;
        shares[m.person] = shareFor(b, cost, desc, p, memberCols.length);
      }
    }
    const base = `${date}|${desc}|${cost}|${cat}`;
    seen[base] = (seen[base] || 0) + 1;
    out.push({ date, desc, cat, cost, cur: cur || 'EUR', raw, shares, key: `${base}#${seen[base]}` });
  }
  return { memberCols, rows: out };
}

/* =========================================================
   Cálculos derivados
   ========================================================= */
function groupOf(origin){ return S.groups.find(g => g.origin === origin); }
// un grupo puede tener otros prefijos (aliases) si lo renombraron en Splitwise ("lucas-maca-in-paris" -> "lucas-in-paris")
function groupForPrefix(prefix){ return S.groups.find(g => g.prefix === prefix) || S.groups.find(g => (g.aliases || []).includes(prefix)); }
const maxDateOf = origin => S.expenses.filter(e => e.origin === origin).reduce((a, e) => e.date > a ? e.date : a, '');

/* Une dos grupos que en realidad son el mismo. Cada CSV trae el historial completo, así que se quedan
   los gastos del que llega más lejos en el tiempo (el export más nuevo); el otro queda como alias. */
function mergeGroups(fromO, intoO){
  const from = groupOf(fromO), into = groupOf(intoO);
  if (!from || !into || from === into) return null;
  into.aliases = [...new Set([...(into.aliases || []), from.prefix, ...(from.aliases || [])])].filter(p => p !== into.prefix);
  const dropIds = o => { for (const e of S.expenses) if (e.origin === o) delete S.overrides[e.id]; S.expenses = S.expenses.filter(e => e.origin !== o); };
  const nFrom = S.expenses.filter(e => e.origin === fromO).length, nInto = S.expenses.filter(e => e.origin === intoO).length;
  const fromNewer = maxDateOf(fromO) > maxDateOf(intoO);
  // ubicaciones: gana la confirmada
  const tf = S.trips[fromO], ti = S.trips[intoO];
  const trip = (tf?.confirmed && !ti?.confirmed) ? tf : (ti || tf);
  if (fromNewer){ dropIds(intoO); delete S.imports[intoO]; renameOrigin(fromO, intoO); }
  else { dropIds(fromO); delete S.imports[fromO]; }
  if (trip) S.trips[intoO] = trip; else delete S.trips[intoO];
  delete S.trips[fromO]; delete S.tripCities[fromO]; delete S.tripCities[intoO];
  S.groups = S.groups.filter(g => g !== from);
  return { kept: fromNewer ? nFrom : nInto, dropped: fromNewer ? nInto : nFrom };
}
function rate(cur){ return S.rates[cur] || 1; }

function enrich(e){
  const ov = S.overrides[e.id] || {};
  const g = groupOf(e.origin);
  let simp = ov.simp;
  if (!simp){
    const mapped = S.catMap[e.cat];
    if (mapped && S.excludedCats.includes(mapped)) simp = mapped;   // pagos entre personas, también dentro de viajes
    else if (g && g.trip) simp = 'Viajes';
    else if (!e.cat) simp = 'Descarte';
    else simp = S.catMap[e.cat] || 'Otros';
  }
  const shares = ov.shares || e.shares;
  const k = 1 / rate(e.cur);
  const sharesEUR = {};
  for (const p of S.people) sharesEUR[p.id] = r2((shares[p.id] || 0) * k);
  const excluded = !!ov.excluded || S.excludedCats.includes(simp);
  const assigned = S.people.reduce((a,p) => a + (shares[p.id]||0), 0);
  // ambiguo: nadie quedó con parte y ninguno de los dos tenía saldo (no se sabe de quién era)
  const rawVals = Object.values(e.raw || {});
  const issue = !excluded && !ov.shares && e.cost > 0 && assigned === 0 && rawVals.length > 1 && rawVals.every(v => v === 0);
  return { ...e, simp, shares, sharesEUR, costEUR: r2(e.cost * k), excluded, issue, hasOverride: !!S.overrides[e.id] };
}
function allEnriched(){ return S.expenses.map(enrich).sort((a,b) => b.date.localeCompare(a.date)); }

function monthlyMatrix(personId){
  const m = {}; // month -> cat -> amount
  for (const e of allEnriched()){
    if (e.excluded) continue;
    const v = personId === 'ALL' ? S.people.reduce((a,p)=>a+e.sharesEUR[p.id],0) : e.sharesEUR[personId];
    if (!v) continue;
    const mo = monthOf(e.date);
    (m[mo] ??= {})[e.simp] = ((m[mo]||{})[e.simp] || 0) + v;
  }
  return m;
}
function spendCats(){ return S.simpCats.filter(c => !S.excludedCats.includes(c)); }

function becaFor(month){
  // si el mes no tiene datos, usa la base del último mes cargado
  const keys = Object.keys(S.beca).sort();
  const own = S.beca[month];
  let base = own?.base;
  let inherited = false;
  if (base == null){ const prev = keys.filter(k => k < month).pop(); base = prev ? S.beca[prev].base : 0; inherited = true; }
  const puchos = own?.puchos || 0, ajuste = own?.ajuste || 0;
  return { base, puchos, ajuste, inherited, total: r2(base + puchos * S.puchoPrecio / 2 + ajuste) };
}

/* =========================================================
   Render principal
   ========================================================= */
/* Grupos duplicados: dos grupos que comparten buena parte de sus gastos (misma fecha, descripción y monto)
   son casi seguro el mismo grupo de Splitwise exportado con dos nombres. */
function duplicateGroups(){
  const keys = {};
  for (const e of S.expenses) (keys[e.origin] ??= new Set()).add(`${e.date}|${normTxt(e.desc)}|${e.cost}`);
  const out = [];
  const origins = Object.keys(keys).filter(o => o !== 'Manual' && groupOf(o));
  for (let i = 0; i < origins.length; i++) for (let j = i + 1; j < origins.length; j++){
    const a = keys[origins[i]], b = keys[origins[j]];
    const common = [...a].filter(k => b.has(k)).length;
    if (common >= 3 && common / Math.min(a.size, b.size) >= 0.6){
      // se une en el que tiene el export más nuevo
      const [older, newer] = maxDateOf(origins[i]) > maxDateOf(origins[j]) ? [origins[j], origins[i]] : [origins[i], origins[j]];
      if (!(S.ignoredDups || []).includes(older + '|' + newer)) out.push({ older, newer, common });
    }
  }
  return out;
}
function renderDupBanner(main){
  const dups = duplicateGroups(); if (!dups.length) return;
  const box = document.createElement('div');
  box.innerHTML = dups.map((d, i) => `<div class="banner" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span>⚠️ <b>${esc(d.older)}</b> y <b>${esc(d.newer)}</b> parecen el mismo grupo de Splitwise: tienen ${d.common} gastos repetidos, que se están contando dos veces.</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="btn small-btn" data-dupmerge="${i}">Unir en "${esc(d.newer)}"</button>
    <button class="btn sec small-btn" data-dupignore="${i}">No son el mismo</button></span></div>`).join('');
  main.prepend(box);
  box.querySelectorAll('[data-dupmerge]').forEach(b => b.onclick = () => {
    const d = dups[+b.dataset.dupmerge], r = mergeGroups(d.older, d.newer); save(); render();
    if (r) toast(`Listo: un solo grupo "${d.newer}" con ${r.kept} gastos (se sacaron ${r.dropped} del export viejo)`);
  });
  box.querySelectorAll('[data-dupignore]').forEach(b => b.onclick = () => {
    const d = dups[+b.dataset.dupignore]; (S.ignoredDups ??= []).push(d.older + '|' + d.newer); save(); render();
  });
}

/* ---------- Para revisar: todo lo que necesita una decisión, en un solo lugar ---------- */
function reviewItems(){
  const items = [], ign = S.reviewIgnored || {};
  const add = it => { if (!ign[it.key]) items.push(it); };
  if (canFolder && !dirHandle) add({ kind: 'folder', key: 'folder', title: 'La carpeta data no está conectada',
    text: 'Sin la carpeta, los datos quedan solo en este navegador: no se comparten entre compus ni tienen respaldo.' });
  duplicateGroups().forEach(d => add({ kind: 'dup', key: `dup|${d.older}|${d.newer}`, d,
    title: `${d.older} y ${d.newer} parecen el mismo grupo`, text: `Tienen ${d.common} gastos repetidos que se están contando dos veces.` }));
  const all = allEnriched();
  const cats = {};
  for (const e of all){
    if (e.excluded || !e.cat || S.catMap[e.cat] || groupOf(e.origin)?.trip || S.overrides[e.id]?.simp) continue;
    const c = cats[e.cat] ??= { n: 0, total: 0, ex: [] }; c.n++; c.total += e.costEUR; if (c.ex.length < 3) c.ex.push(e.desc);
  }
  Object.entries(cats).sort((a, b) => b[1].total - a[1].total).forEach(([cat, c]) => add({ kind: 'cat', key: 'cat|' + cat, cat, c,
    title: `Categoría de Splitwise sin asignar: ${catEs(cat)}${catEs(cat) !== cat ? ` (${cat})` : ''}`,
    text: `${c.n} gasto${c.n > 1 ? 's' : ''} · ${eur(c.total)} van a "Otros". Ej.: ${c.ex.map(x => `"${x}"`).join(', ')}` }));
  all.filter(e => e.issue).forEach(e => add({ kind: 'issue', key: 'issue|' + e.id, e,
    title: `Gasto sin asignar: ${e.desc}`, text: `${e.date} · ${e.origin} · ${eur(e.costEUR)}. Nadie quedó con parte (saldo 0 y la descripción no nombra a nadie).` }));
  [...new Set(S.expenses.map(e => e.cur))].filter(c => c && !S.rates[c]).forEach(cur => add({ kind: 'cur', key: 'cur|' + cur, cur,
    title: `Moneda sin tipo de cambio: ${cur}`, text: `${S.expenses.filter(e => e.cur === cur).length} gastos en ${cur} se están sumando como si fueran euros.` }));
  [...new Set(tripExpenses().map(e => e.origin))].forEach(o => {
    const t = S.trips[o];
    if (t && !t.confirmed) add({ kind: 'trip', key: 'trip|' + o, o, t,
      title: `Ubicación sin confirmar: ${o.replace(/^viaje\s*-\s*/i, '')}`,
      text: t.stops.length ? `Propuesta: ${t.stops.map(s => s.full || s.name).join(' · ')}` : 'No encontré dónde fue este viaje.' });
  });
  const dataMonths = S.expenses.map(e => monthOf(e.date)).sort();
  if (dataMonths.length) monthRange(dataMonths[0], currentMonth()).filter(m => S.beca[m]?.base == null).forEach(m => add({ kind: 'beca', key: 'beca|' + m, m,
    title: `Beca de ${monthLabel(m)} sin cargar`, text: `Se está usando la del mes anterior (${eur(becaFor(m).base)} c/u). Confirmala o corregila.` }));
  return items;
}

      q('select').onchange = e => { if (!e.target.value) return; S.catMap[it.cat] = e.target.value; done(`"${catEs(it.cat)}" ahora va a ${e.target.value} (también en los próximos CSV)`); };
    }

      const setShares = sh => { S.overrides[it.e.id] = { ...(S.overrides[it.e.id] || {}), shares: sh }; done('Gasto asignado'); };
      row.querySelectorAll('[data-who]').forEach(b => b.onclick = () => {
        const w = b.dataset.who, c = it.e.cost;
        setShares(Object.fromEntries(S.people.map(p => [p.id, w === 'half' ? r2(c / S.people.length) : (p.id === w ? c : 0)])));
      });
      q('[data-a=excl]').onclick = () => { S.overrides[it.e.id] = { ...(S.overrides[it.e.id] || {}), excluded: true }; done('Gasto excluido de los totales'); };

function reviewActions(it, simpOpts){
  switch (it.kind){
    case 'folder': return '<button class="btn small-btn" data-a="connect">📁 Conectar carpeta data</button>';
    case 'dup': return `<button class="btn small-btn" data-a="merge">Unir en "${esc(it.d.newer)}"</button><button class="btn sec small-btn" data-a="notsame">No son el mismo</button>`;
    case 'cat': return `<select><option value="">Asignar a…</option>${simpOpts}</select>`;
    case 'issue': return `${S.people.map(p => `<button class="btn sec small-btn" data-who="${p.id}">Todo ${esc(p.name)}</button>`).join('')}
      <button class="btn sec small-btn" data-who="half">Mitad y mitad</button><button class="btn sec small-btn" data-a="excl">Excluir</button>`;
    case 'cur': return `<label class="small">1 € = <input type="number" step="any" min="0" style="width:90px"> ${esc(it.cur)}</label><button class="btn small-btn" data-a="rate">Guardar</button>`;
    case 'trip': return `${it.t.stops.length ? '<button class="btn small-btn" data-a="confirm">Confirmar</button>' : ''}<button class="btn sec small-btn" data-a="change">${it.t.stops.length ? 'Cambiar' : 'Elegir lugar'}</button>`;
    case 'beca': return `<label class="small">Base c/u <input type="number" step="0.01" placeholder="${becaFor(it.m).base}" style="width:90px"> €</label><button class="btn small-btn" data-a="beca">Confirmar</button>`;
  }
  return '';
}

/* ---------- que redibujar no saque al usuario del campo que está editando ----------
   1) Si render() se llama dentro de un evento "change"/"input", se hace un instante después,
      cuando el foco ya pasó al campo siguiente; y después de redibujar se devuelve el foco a ese campo.
   2) En los campos de fecha, el "change" llega con cada dígito del año (0002, 0020…): se espera a que
      el usuario salga del campo (o apriete Enter) para tomar el valor.
   3) Si llegan cambios de otra compu mientras se está escribiendo, se redibuja cuando se termine. */
let renderQueued = false, renderPending = false;
const isEditing = () => { const a = document.activeElement; return !!a && a.matches?.('input, select, textarea') && !a.matches('[type=checkbox],[type=radio],[type=button]'); };
function renderWhenIdle(){ if (isEditing() || $('#dlg').open) renderPending = true; else render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (renderPending && !isEditing() && !$('#dlg').open){ renderPending = false; render(); } }, 50));
function focusSignature(){
  const a = document.activeElement;
  if (!a || a === document.body || !$('#main').contains(a)) return null;
  const attrs = [...a.attributes].filter(x => x.name === 'id' || x.name === 'name' || x.name.startsWith('data-'));
  if (!attrs.length) return null;
  let sel = null; try { sel = [a.selectionStart, a.selectionEnd]; } catch(e){}
  return { css: a.tagName.toLowerCase() + attrs.map(x => `[${x.name}="${CSS.escape(x.value)}"]`).join(''), sel };
}
function restoreFocus(sig){
  if (!sig) return;
  const el = $('#main').querySelector(sig.css); if (!el) return;
  el.focus({ preventScroll: true });
  if (sig.sel && sig.sel[0] != null) try { el.setSelectionRange(sig.sel[0], sig.sel[1]); } catch(e){}
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches?.('input[type=date]') && document.activeElement === t && !t._commit){ e.stopImmediatePropagation(); t._dirty = true; }
}, true);
document.addEventListener('blur', e => {
  const t = e.target;
  if (t.matches?.('input[type=date]') && t._dirty){ t._dirty = false; t._commit = true; t.dispatchEvent(new Event('change', { bubbles: true })); t._commit = false; }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches?.('input[type=date]')) e.target.blur(); }, true);

function render(){
  const ev = window.event;
  if (ev && (ev.type === 'change' || ev.type === 'input' || ev.type === 'blur' || ev.type === 'focusout')){
    if (!renderQueued){ renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 0); }
    return;
  }
  const sig = focusSignature();
  renderInner();
  restoreFocus(sig);
}
function renderInner(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#navMore').classList.toggle('active', !!document.querySelector('.nav-more button.active'));
  const main = $('#main');
  if (!S.expenses.length && view !== 'importar' && view !== 'config'){
    main.innerHTML = `<div class="panel"><h2>Todavía no hay gastos cargados</h2>
      <p>Exportá los CSV desde Splitwise (Grupo → Configuración → Exportar como hoja de cálculo), guardalos en la carpeta <b>data</b>
      y tocá <b>📁 Conectar carpeta data</b> arriba a la derecha. La app lee todos los CSV de esa carpeta (el del depto y los de cada viaje).</p>
      ${canFolder && !dirHandle ? `<button class="btn" onclick="connectFolder()">📁 Conectar carpeta data</button>` : ''}
      <button class="btn sec" onclick="go('importar')">Importar un CSV a mano</button></div>`;
    renderFileStatus(); return;
  }
  ({ resumen: renderResumen, beca: renderBeca, presupuesto: renderPresupuesto, viajes: renderViajesRoot, gastos: renderGastos, importar: renderImportar, config: renderConfig, revisar: renderRevisar, planificar: renderViajesRoot })[view](main);
  if (view !== 'revisar') renderDupBanner(main);

    b.innerHTML = `Estás viendo la copia guardada en este navegador, que puede estar desactualizada. <button class="btn small-btn">${ONLINE ? '🔑 Entrar con Google' : '📁 Abrir carpeta data'}</button> para ver los datos al día.`;
    b.querySelector('button').onclick = reconnectFolder; main.prepend(b);
  }
  updateReviewBadge();
  renderFileStatus();
}
function go(v){ view = v; hideTip(); render(); window.scrollTo(0,0); }
$('#nav').addEventListener('click', e => {

/* ---------- Resumen mensual ---------- */
const incomeFor = (personId, m) => becaFor(m).total * (personId === 'ALL' ? S.people.length : 1);

function renderResumen(main){
  const mat = monthlyMatrix(ui.person);
  const dataMonths = Object.keys(mat).sort();
  const cur = currentMonth();
  const allMonths = dataMonths.length ? monthRange(dataMonths[0], [dataMonths[dataMonths.length-1], cur].sort().pop()) : [];
  const years = [...new Set(allMonths.map(m => m.slice(0,4)))];
  const months = ui.year === 'all' ? allMonths : allMonths.filter(m => m.startsWith(ui.year));
  const cats = spendCats().filter(c => months.some(m => mat[m]?.[c]));
  if (ui.focusCat && !cats.includes(ui.focusCat)) ui.focusCat = null;
  const totalOf = m => cats.reduce((a,c) => a + (mat[m]?.[c] || 0), 0);
  const closed = months.filter(m => m < cur);
  const avg = closed.length ? closed.reduce((a,m)=>a+totalOf(m),0) / closed.length : 0;
  const catAvg = c => closed.length ? closed.reduce((a,m)=>a+(mat[m]?.[c]||0),0)/closed.length : 0;
  const lastClosed = closed[closed.length-1];

  // saldo = ingreso - gasto; acumulado dentro del período elegido
  let acc = 0;
  const saldo = months.map(m => { const ingreso = incomeFor(ui.person, m), gasto = totalOf(m), s = ingreso - gasto; acc += s;
    return { m, ingreso, gasto, saldo: s, acum: acc, current: m === cur }; });
  const accClosed = saldo.filter(r => !r.current).pop()?.acum ?? 0;
  const overMonths = saldo.filter(r => !r.current && r.saldo < 0).length;

  main.innerHTML = `
  <div class="row" style="margin-bottom:14px">
    <label>Persona ${personSelect('selPerson', ui.person)}</label>

  </div>
  <div class="kpis">
    <div class="kpi"><div class="muted small">Este mes (${monthLabel(cur)})</div><div class="v">${eur(totalOf(cur))}</div><div class="small muted">de ${eur(incomeFor(ui.person, cur))} de ingreso</div></div>
    <div class="kpi"><div class="muted small">Mes pasado${lastClosed?` (${monthLabel(lastClosed)})`:''}</div><div class="v">${eur(lastClosed?totalOf(lastClosed):0)}</div>
      ${lastClosed?`<div class="small ${saldo.find(r=>r.m===lastClosed).saldo>=0?'pos':'neg'}">saldo ${eur(saldo.find(r=>r.m===lastClosed).saldo)}</div>`:''}</div>
    <div class="kpi"><div class="muted small">Promedio mensual (meses cerrados)</div><div class="v">${eur(avg)}</div></div>
    <div class="kpi"><div class="muted small">Saldo acumulado (meses cerrados)</div><div class="v ${accClosed>=0?'pos':'neg'}">${eur(accClosed)}</div>
      <div class="small muted">${overMonths ? `${overMonths} mes${overMonths>1?'es':''} con gasto mayor al ingreso` : 'ningún mes pasado del ingreso'}</div></div>
  </div>
  <div class="panel"><h2>Gasto por mes vs. ingreso</h2>
    <div class="legend" id="spendLegend">
      ${cats.map(c=>`<button data-cat="${esc(c)}" class="${ui.focusCat===c?'sel':ui.focusCat?'off':''}" title="Clic para ver solo esta categoría"><i style="background:${catColor(c)};width:10px;height:10px;border-radius:3px;display:inline-block"></i>${esc(c)}</button>`).join('')}
      ${ui.focusCat ? '' : '<span class="small muted" style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px"><span class="swl"></span>Ingreso del mes</span>'}
    </div>
    ${ui.focusCat ? `<p class="small muted" style="margin:6px 0 0">Mostrando solo <b>${esc(ui.focusCat)}</b> (escala ajustada) · <a href="#" id="clearFocus">ver todas</a></p>`
      : `<p class="small muted" style="margin:6px 0 0">${TOUCH ? 'Tocá un mes para ver su detalle abajo' : 'Pasá el mouse por las barras para ver el detalle'} · ${TOUCH ? 'tocá' : 'clic en'} una categoría para verla sola</p>`}
    <div class="chart" id="spendChart">${spendChart(months, ui.focusCat ? [ui.focusCat] : cats, mat, ui.focusCat ? null : saldo)}</div>
  </div>
  <div class="panel"><h2>Saldo mensual y acumulado</h2>
    <div class="legend">
      <span><i style="background:var(--bar-pos)"></i>Ahorro del mes</span><span><i style="background:var(--bar-neg)"></i>Gasto de más</span>
      <span><span class="swline"></span>Acumulado del período</span>
    </div>
    <div class="chart" id="saldoChart">${saldoChart(saldo)}</div>
  </div>
  <div class="panel"><h2>Detalle por categoría <span class="muted small">— hacé clic en una celda para ver los gastos</span></h2>
  <div class="table-wrap sticky1"><table>
    <thead><tr><th>Mes</th>${cats.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Total</th><th class="num">Ingreso</th><th class="num">Saldo</th><th class="num">Acumulado</th></tr></thead>
    <tbody>
    ${saldo.slice().reverse().map(r => `<tr><td>${monthLabel(r.m)}${r.current?' <span class="tag">en curso</span>':''}</td>
      ${cats.map(c=>`<td class="num click" data-m="${r.m}" data-c="${esc(c)}">${eur0(mat[r.m]?.[c])}</td>`).join('')}
      <td class="num click" data-m="${r.m}"><b>${eur(r.gasto)}</b></td><td class="num">${eur(r.ingreso)}</td>
      <td class="num ${r.saldo>=0?'pos':'neg'}">${eur(r.saldo)}</td><td class="num ${r.acum>=0?'pos':'neg'}">${eur(r.acum)}</td></tr>`).join('')}
    <tr class="sub"><td>Promedio (cerrados)</td>${cats.map(c=>`<td class="num">${eur0(catAvg(c))}</td>`).join('')}<td class="num">${eur(avg)}</td><td></td><td></td><td></td></tr>
    <tr class="total"><td>Total</td>${cats.map(c=>`<td class="num">${eur(months.reduce((a,m)=>a+(mat[m]?.[c]||0),0))}</td>`).join('')}
      <td class="num">${eur(saldo.reduce((a,r)=>a+r.gasto,0))}</td><td class="num">${eur(saldo.reduce((a,r)=>a+r.ingreso,0))}</td><td class="num">${eur(acc)}</td><td></td></tr>
    </tbody></table></div></div>`;
  $('#selPerson').onchange = e => { ui.person = e.target.value; render(); };
  $('#selYear').onchange = e => { ui.year = e.target.value; render(); };
  main.querySelectorAll('td.click').forEach(td => td.onclick = () => {
    Object.assign(ui.filters, { month: td.dataset.m, simp: td.dataset.c || '', origin:'', q:'', person: ui.person==='ALL'?'':ui.person, onlyIssues:false });
    go('gastos');
  });
  main.querySelectorAll('#spendLegend button').forEach(b => {
    b.onclick = () => { ui.focusCat = ui.focusCat === b.dataset.cat ? null : b.dataset.cat; render(); };
    b.onmouseenter = () => { if (!ui.focusCat) highlightCat(b.dataset.cat); };
    b.onmouseleave = () => highlightCat(null);
  });
  $('#clearFocus') && ($('#clearFocus').onclick = e => { e.preventDefault(); ui.focusCat = null; render(); });
  bindSpendHover(months, ui.focusCat ? [ui.focusCat] : cats, mat, ui.focusCat ? null : saldo);
  bindSaldoHover(saldo);
}

/* ---------- utilidades de gráficos ---------- */
function niceScale(min, max, ticks = 5){
  const span = (max - min) || 1;
  const raw = span / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw);
  return { step, lo: Math.floor(min / step) * step, hi: Math.ceil(max / step) * step };
}
function chartWidth(){ return Math.max(320, Math.min(($('#main').clientWidth || 900) - 34, 1400)); }
const monthTick = (m, i) => MESES[+m.slice(5)-1] + (i === 0 || m.endsWith('-01') ? ` ${m.slice(2,4)}` : '');
// cada cuántos meses va una etiqueta para que no se pisen (en el celular, uno de cada dos o tres)
const TOUCH = matchMedia('(hover: none)').matches;
const tickEvery = slot => Math.max(1, Math.ceil(36 / slot));
// rectángulo con las esquinas de arriba (o de abajo) redondeadas
function roundedBar(x, y, w, h, r, top = true){
  r = Math.min(r, w/2, h);
  if (h <= 0) return '';
  return top
    ? `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`
    : `M${x},${y}H${x+w}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x+r}Q${x},${y+h} ${x},${y+h-r}Z`;
}
const tipEl = () => $('#tip') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'tip' }));
// anchor = {left, right} en pantalla: el tooltip va al costado de la barra, sin taparla
function showTip(html, ev, anchor){
  const t = tipEl(); t.innerHTML = html; t.style.display = 'block';
  const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  const L = anchor ? anchor.left : ev.clientX, R = anchor ? anchor.right : ev.clientX;
  let x = R + pad;
  if (x + w > innerWidth - 8) x = L - w - pad;
  if (x < 8) x = 8;
  let y = ev.clientY - h / 2;
  y = Math.min(Math.max(8, y), innerHeight - h - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function screenX(svg, x){ const p = svg.createSVGPoint(); p.x = x; p.y = 0; return p.matrixTransform(svg.getScreenCTM()).x; }
// celular: el detalle de un gráfico se cierra al tocar fuera de él o al desplazarse
function onTapOutside(el, fn){
  const h = ev => { if (!document.body.contains(el)){ document.removeEventListener('pointerdown', h); return; } if (!el.contains(ev.target)) fn(); };
  document.addEventListener('pointerdown', h);
}
function hideTip(){ const t = $('#tip'); if (t) t.style.display = 'none'; }
function svgPoint(svg, ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

/* ---------- gráfico de gasto (barras apiladas + línea de ingreso) ---------- */
let spendGeom = null;
function spendChart(months, cats, mat, saldo){
  if (!months.length) return '<p class="muted">Sin datos.</p>';
  const W = chartWidth(), H = 360, padL = 46, padR = 14, padT = 26, padB = 30;
  const totals = months.map(m => cats.reduce((a,c)=>a+(mat[m]?.[c]||0),0));
  const inc = saldo ? saldo.map(r => r.ingreso) : [];
  const { step, hi } = niceScale(0, Math.max(...totals, ...inc, 1));
  const y = v => padT + (H - padT - padB) * (1 - v / hi);
  const slot = (W - padL - padR) / months.length, bw = Math.min(46, slot * 0.66);
  const geom = { months, cats, slot, padL, bw, H, padT, padB, W, segs: [] };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto mensual por categoría comparado con el ingreso">`;
  for (let v = 0; v <= hi + 1e-9; v += step)
    s += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${eurShort(v)}</text>`;
  s += `<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const short = slot < 40;
  months.forEach((m, i) => {
    const x = padL + i*slot + (slot-bw)/2, segs = [];
    let accV = 0;
    const present = cats.filter(c => (mat[m]?.[c] || 0) > 0);
    present.forEach((c, k) => {
      const v = mat[m][c], y0 = y(accV), y1 = y(accV + v);
      const isTop = k === present.length - 1;
      // 1px de separación (color de fondo) entre segmentos
      const gap = present.length > 1 && !isTop && (y0 - y1) > 3 ? 1 : 0;
      const h = Math.max(0, y0 - y1 - gap);
      s += isTop ? `<path class="seg" data-i="${i}" data-c="${esc(c)}" d="${roundedBar(x, y1, bw, y0 - y1, 4)}" fill="${catColor(c)}"/>`
                 : `<rect class="seg" data-i="${i}" data-c="${esc(c)}" x="${x}" y="${y1 + gap}" width="${bw}" height="${h}" fill="${catColor(c)}"/>`;
      segs.push({ c, v, y0, y1 });
      accV += v;
    });
    geom.segs[i] = { x, segs, total: totals[i] };
    const over = saldo && !saldo[i].current && totals[i] > saldo[i].ingreso;
    // en pantallas chicas no entran todos los totales ni todos los meses: el detalle queda en el tooltip
    if (totals[i] > 0 && slot >= 24) s += `<text class="tot${over?' over':''}" x="${x + bw/2}" y="${y(totals[i]) - 6}" text-anchor="middle" font-size="${short?10:11}">${over?'▲':''}${eurShort(totals[i])}</text>`;
    if (i % tickEvery(slot) === 0) s += `<text x="${x + bw/2}" y="${H - 10}" text-anchor="middle">${monthTick(m, i)}</text>`;
  });
  if (saldo){
    // línea escalonada del ingreso (de fondo, punteada)
    let d = '';
    saldo.forEach((r, i) => { const x0 = padL + i*slot, x1 = x0 + slot, yy = y(r.ingreso); d += (i ? `L${x0},${yy}` : `M${x0},${yy}`) + `L${x1},${yy}`; });
    s += `<path d="${d}" fill="none" stroke="var(--text)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 4"/>`;
    const last = saldo[saldo.length-1];
    s += `<text x="${W - padR}" y="${y(last.ingreso) - 6}" text-anchor="end" style="fill:var(--text);opacity:.75">Ingreso ${eurShort(last.ingreso)}</text>`;
  }
  s += `<g id="spendHover"></g><rect id="spendHit" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  spendGeom = geom;
  return s;
}

function highlightCat(c){
  const box = $('#spendChart'); if (!box) return;
  box.classList.toggle('dim', !!c);
  box.querySelectorAll('.seg').forEach(el => el.classList.toggle('on', el.dataset.c === c));
}

function bindSpendHover(months, cats, mat, saldo){
  const box = $('#spendChart'), svg = box?.querySelector('svg'), hit = $('#spendHit'), layer = $('#spendHover');
  if (!svg || !spendGeom) return;
  const G = spendGeom;
  const move = ev => {
    const p = svgPoint(svg, ev);
    const i = Math.floor((p.x - G.padL) / G.slot);
    const col = G.segs[i];
    if (!col || !col.segs.length){ leave(); return; }
    // segmento bajo el cursor; si el cursor está entre segmentos chicos, el más cercano
    let best = null, bestD = Infinity;
    for (const sg of col.segs){
      const d = p.y < sg.y1 ? sg.y1 - p.y : p.y > sg.y0 ? p.y - sg.y0 : 0;
      if (d < bestD || (d === bestD && best && (sg.y0 - sg.y1) < (best.y0 - best.y1))){ best = sg; bestD = d; }
    }
    // lo agranda: más ancho y con un alto mínimo, para que se vea aunque sea chiquito
    const minH = 10, h = Math.max(minH, best.y0 - best.y1), cy = (best.y0 + best.y1) / 2;
    const ex = 7, x = col.x - ex, w = G.bw + ex*2;
    layer.innerHTML = `<rect x="${col.x - 3}" y="${G.padT - 18}" width="${G.bw + 6}" height="${G.H - G.padB - G.padT + 18}" fill="var(--text)" opacity=".04" rx="4"/>
      <rect x="${x}" y="${cy - h/2}" width="${w}" height="${h}" rx="3" fill="${catColor(best.c)}" stroke="var(--panel)" stroke-width="2"/>
      <rect x="${x - 1}" y="${cy - h/2 - 1}" width="${w + 2}" height="${h + 2}" rx="4" fill="none" stroke="var(--text)" stroke-width="1.5"/>`;
    highlightCat(best.c);
    const m = G.months[i], r = saldo?.[i];
    const rows = col.segs.slice().reverse();
    showTip(`<div class="h">${monthLabel(m)} · ${esc(best.c)}: ${eur(best.v)}</div>
      <div class="sub">Total ${eur(col.total)}${r ? ` · ingreso ${eur(r.ingreso)} · <span class="${r.saldo>=0?'pos':'neg'}">saldo ${eur(r.saldo)}</span>` : ''}</div>
      <table>${rows.map(sg => `<tr class="${sg === best ? 'on' : ''}"><td><i style="background:${catColor(sg.c)}"></i>${esc(sg.c)}</td>
        <td style="text-align:right">${eur(sg.v)}</td><td style="text-align:right;color:var(--muted)">${col.total ? Math.round(sg.v / col.total * 100) : 0}%</td></tr>`).join('')}</table>`,
      ev, { left: screenX(svg, x - 4), right: screenX(svg, x + w + 4) });
  };
  const leave = () => { layer.innerHTML = ''; highlightCat(null); hideTip(); };
  const openGastos = (m, simp) => {
    Object.assign(ui.filters, { month: m, simp: simp || '', origin:'', q:'', person: ui.person==='ALL'?'':ui.person, onlyIssues:false });
    go('gastos');
  };
  if (TOUCH){
    // celular: tocar un mes abre debajo del gráfico la tabla de ese mes; tocar una categoría abre esos gastos
    let box = $('#spendDetail');
    if (!box){ box = document.createElement('div'); box.id = 'spendDetail'; $('#spendChart').after(box); }
    const show = i => {
      const col = G.segs[i], m = G.months[i], r = saldo?.[i];
      if (!col){ box.innerHTML = ''; layer.innerHTML = ''; return; }
      layer.innerHTML = `<rect x="${col.x - 3}" y="${G.padT - 18}" width="${G.bw + 6}" height="${G.H - G.padB - G.padT + 18}" fill="var(--accent)" opacity=".14" rx="4"/>`;
      const rows = col.segs.slice().reverse();
      box.innerHTML = `<div class="sd-head"><div><b>${monthLabel(m)}</b> · total <b>${eur(col.total)}</b>${r ? `<div class="small muted">ingreso ${eur(r.ingreso)} · <span class="${r.saldo>=0?'pos':'neg'}">saldo ${eur(r.saldo)}</span></div>` : ''}</div>
          <button class="icon" id="sdClose" aria-label="Cerrar">✕</button></div>
        ${rows.map(sg => `<button class="sd-row" data-c="${esc(sg.c)}"><span><i style="background:${catColor(sg.c)}"></i>${esc(sg.c)}</span><span class="num">${eur(sg.v)}</span><span class="muted small num">${col.total ? Math.round(sg.v / col.total * 100) : 0}%</span><span class="chev">›</span></button>`).join('') || '<p class="muted small">Sin gastos.</p>'}
        <button class="sd-row sd-all"><span>Ver todos los gastos del mes</span><span></span><span></span><span class="chev">›</span></button>`;
      box.querySelectorAll('.sd-row').forEach(b => b.onclick = () => openGastos(m, b.dataset.c || ui.focusCat));
      $('#sdClose').onclick = () => { ui.spendSel = null; show(-1); };
    };
    hit.addEventListener('click', ev => {
      const p = svgPoint(svg, ev), i = Math.floor((p.x - G.padL) / G.slot); if (!G.months[i]) return;
      ui.spendSel = G.months[i]; show(i);
    });
    // si ya había un mes elegido (p. ej. al volver de Gastos), se vuelve a mostrar
    const prev = ui.spendSel ? G.months.indexOf(ui.spendSel) : -1;
    if (prev >= 0) show(prev);
    hit.style.cursor = 'pointer';
    return;
  }
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', leave);
  hit.addEventListener('click', ev => {   // clic en una barra -> ver esos gastos
    const p = svgPoint(svg, ev), i = Math.floor((p.x - G.padL) / G.slot); if (!G.months[i]) return;
    hideTip();
    Object.assign(ui.filters, { month: G.months[i], simp: ui.focusCat || '', origin:'', q:'', person: ui.person==='ALL'?'':ui.person, onlyIssues:false });
    go('gastos');
  });
  hit.style.cursor = 'pointer';
}

/* ---------- gráfico de saldo (barras +/- y acumulado) ---------- */
let saldoGeom = null;
function saldoChart(rows){
  if (!rows.length) return '<p class="muted">Sin datos.</p>';
  const W = chartWidth(), H = 300, padL = 52, padR = 14, padT = 22, padB = 30;
  const vals = rows.flatMap(r => [r.saldo, r.acum]);
  const { step, lo, hi } = niceScale(Math.min(0, ...vals), Math.max(0, ...vals));
  const y = v => padT + (H - padT - padB) * (hi - v) / (hi - lo);
  const slot = (W - padL - padR) / rows.length, bw = Math.min(34, slot * 0.55);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo mensual y acumulado">`;
  for (let v = lo; v <= hi + 1e-9; v += step)
    s += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${eurShort(v)}</text>`;
  s += `<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const pts = [];   // el mes en curso no entra en la línea: su gasto todavía está incompleto
  rows.forEach((r, i) => {
    const cx = padL + i*slot + slot/2, x = cx - bw/2, pos = r.saldo >= 0;
    const y0 = y(0), y1 = y(r.saldo), top = Math.min(y0, y1), h = Math.abs(y0 - y1);
    if (h > 0.5) s += `<path d="${roundedBar(x, top, bw, h, 4, pos)}" fill="${pos ? 'var(--bar-pos)' : 'var(--bar-neg)'}" ${r.current ? 'fill-opacity=".35" stroke-dasharray="3 2" stroke="'+(pos?'var(--bar-pos)':'var(--bar-neg)')+'"' : ''}/>`;
    if (i % tickEvery(slot) === 0) s += `<text x="${cx}" y="${H - 10}" text-anchor="middle">${monthTick(r.m, i)}</text>`;
    pts.push(r.current ? null : [cx, y(r.acum)]);
  });
  const line = pts.filter(Boolean);
  if (line.length){
    s += `<polyline points="${line.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round"/>`;
    line.forEach(([cx, cy]) => s += `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--text)" stroke="var(--panel)" stroke-width="2"/>`);
    const lastR = rows.filter(r => !r.current).pop(), [lx, ly] = line[line.length-1];
    s += `<text class="tot" x="${lx}" y="${ly - 12}" text-anchor="end">Acum. ${eur(lastR.acum)}</text>`;
  }
  s += `<g id="saldoHover"></g><rect id="saldoHit" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  saldoGeom = { slot, padL, padT, padB, H, pts };
  return s;
}

function bindSaldoHover(rows){

/* ---------- Presupuesto (propuestas + definición + proyección del mes) ---------- */
const daysInMonth = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
const prevMonth = m => { let [y, mm] = m.split('-').map(Number); mm--; if (!mm){ mm = 12; y--; } return `${y}-${String(mm).padStart(2,'0')}`; };
const ceil5 = v => v > 0 ? Math.ceil(v / 5) * 5 : 0;
function pctl(arr, p){
  if (!arr.length) return 0;
  const a = [...arr].sort((x, y) => x - y), i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return a[lo] + (a[hi] - a[lo]) * (i - lo);
}
// values = gasto de la categoría en cada mes cerrado (incluye meses en 0)
function catStats(values){
  const n = values.length;
  if (!n) return { n, mean: 0, median: 0, p90: 0, max: 0, last3: 0, withSpend: 0, irregular: false };
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const q1 = pctl(values, .25), q3 = pctl(values, .75), lim = q3 + 1.5 * (q3 - q1);
  const clean = values.filter(v => v <= lim);
  const withSpend = values.filter(v => v > 0.5).length;
  const l3 = values.slice(-3);
  return { n, mean, median: pctl(values, .5), p90: pctl(clean.length ? clean : values, .9), max: Math.max(...values),
    last3: l3.reduce((a, b) => a + b, 0) / l3.length, withSpend, irregular: withSpend < n * 0.5 };
}
const METHODS = {
  p90:    { label: 'Conservadora', help: 'Percentil 90 sin contar meses atípicos (el mismo cálculo del Excel). Alcanza en 9 de cada 10 meses normales.' },
  mean:   { label: 'Promedio', help: 'Lo que gastaron en promedio por mes.' },
  median: { label: 'Mediana', help: 'El mes típico: la mitad de los meses gastaron menos que esto.' },
  last3:  { label: 'Últimos 3 meses', help: 'Promedio de los últimos tres meses cerrados: sigue la tendencia reciente.' },
};

function dailyIndex(personId){   // mes -> categoría -> [{d, v}]
  const idx = {};
  for (const e of allEnriched()){
    if (e.excluded) continue;
    const v = personId === 'ALL' ? S.people.reduce((a, p) => a + e.sharesEUR[p.id], 0) : e.sharesEUR[personId];
    if (!v) continue;
    ((idx[monthOf(e.date)] ??= {})[e.simp] ??= []).push({ d: +e.date.slice(8, 10), v });
  }
  return idx;
}
const budgetOf = (pid, c) => {
  if (pid !== 'ALL') return S.budgets[pid]?.[c] ?? null;
  const vals = S.people.map(p => S.budgets[p.id]?.[c]);
  return vals.every(v => v == null) ? null : vals.reduce((a, v) => a + (v || 0), 0);
};

function budgetModel(P){
  const cur = currentMonth(), today = new Date().getDate(), D = daysInMonth(cur);
  const mat = monthlyMatrix(P), idx = dailyIndex(P);
  const dataMonths = Object.keys(mat).sort();
  const closedAll = dataMonths.length && dataMonths[0] < cur ? monthRange(dataMonths[0], prevMonth(cur)) : [];
  const win = ui.budgetWin ?? 12;
  const closed = win === 'all' ? closedAll : closedAll.slice(-win);
  const cats = spendCats().filter(c => closed.some(m => mat[m]?.[c]) || mat[cur]?.[c]);
  const method = ui.budgetMethod || 'p90';
  const rows = cats.map(c => {
    const vals = closed.map(m => mat[m]?.[c] || 0), st = catStats(vals);
    const proposal = ceil5(st.irregular ? st.mean : st[method]);
    const budget = budgetOf(P, c);
    // proyección: lo gastado + lo que suele faltar gastar después de este día del mes
    const spent = (idx[cur]?.[c] || []).reduce((a, x) => a + x.v, 0);
    const fracs = closed.map(m => {
      const tot = mat[m]?.[c] || 0; if (!tot) return null;
      const dd = Math.round(today / D * daysInMonth(m));
      return (idx[m]?.[c] || []).filter(x => x.d <= dd).reduce((a, x) => a + x.v, 0) / tot;
    }).filter(f => f != null);
    const frac = fracs.length ? fracs.reduce((a, b) => a + b, 0) / fracs.length : today / D;
    // si va muy atrasado respecto de lo habitual (ej. el alquiler todavía no se pagó), se asume que el gasto igual llega
    const behind = spent < st.mean * frac * 0.5;
    const proj = behind ? Math.max(spent, st.mean) : spent + Math.max(0, st.mean * (1 - frac));
    return { c, vals, st, proposal, budget, target: budget ?? proposal, spent, proj };
  });
  const income = incomeFor(P, cur);
  return { cur, today, D, closed, rows, income, method, win };
}

function sparkline(vals, color){
  const v = vals.slice(-12), max = Math.max(...v, 1), w = 6, gap = 2, H = 22;
  return `<svg width="${v.length * (w + gap)}" height="${H}" style="display:block">${v.map((x, i) => {
    const h = x > 0 ? Math.max(1.5, x / max * H) : 0;
    return `<rect x="${i * (w + gap)}" y="${H - h}" width="${w}" height="${h}" rx="1.5" fill="${color}"><title>${eur(x)}</title></rect>`; }).join('')}</svg>`;
}

  'Électronique':'Electrónica', 'Ménage - Autre':'Hogar', 'Restaurants':'Restaurantes', 'Paiement':'Pago', 'Bateau':'Barco', 'Vélo':'Bici' };
const catEs = c => SW_CAT_ES[c] || c || 'Sin categoría';
const STOPWORDS = new Set(['in','de','la','el','en','con','y','del','los','las','por','the','and','to','a','viaje','trip','export']);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5) + 1;
const fmtDay = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${MESES[+m - 1]} ${y.slice(2)}`; };

function tripExpenses(){ return allEnriched().filter(e => !e.excluded && groupOf(e.origin)?.trip); }
const tripOf = origin => S.trips[origin];
// Lugar de un gasto: 1) la ciudad que nombra la descripción ("hostel munich"), 2) la ciudad de esa fecha, 3) la primera
function stopFor(origin, date, desc = ''){
  const st = tripOf(origin)?.stops || [];
  const d = normTxt(desc);
  return (d && st.find(s => s.match && new RegExp('\\b' + s.match + '\\b').test(d)))
    || st.find(s => (!s.from || s.from <= date) && (!s.to || date <= s.to)) || st[0] || null;
}
const normTxt = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
/* Período real del viaje: los gastos se agrupan en tramos sin huecos de más de 5 días y se toma el
   tramo con más gastos. Así los pasajes/hoteles reservados semanas antes no estiran la duración.
   Si el viaje tiene lugares con fechas cargadas, mandan esas fechas. */
function tripCore(ex){
  const st = (tripOf(ex[0]?.origin)?.stops || []).filter(s => s.from && s.to);
  if (st.length){ const from = st.map(s => s.from).sort()[0], to = st.map(s => s.to).sort().pop(); return { from, to, days: daysBetween(from, to) }; }
  const ds = ex.map(e => e.date).sort();
  if (!ds.length) return { from: '', to: '', days: 0 };
  const clusters = [[ds[0]]];
  for (let i = 1; i < ds.length; i++){
    if (daysBetween(ds[i-1], ds[i]) > 5) clusters.push([]);
    clusters[clusters.length - 1].push(ds[i]);
  }
  const best = clusters.reduce((a, c) => c.length > a.length ? c : a);
  return { from: best[0], to: best[best.length - 1], days: daysBetween(best[0], best[best.length - 1]) };
}
const partOf = (e, P) => P === 'ALL' ? S.people.reduce((a, p) => a + e.sharesEUR[p.id], 0) : e.sharesEUR[P];

/* --- geocodificación (OpenStreetMap / Nominatim) --- */
// Todas las consultas pasan por una cola: Nominatim pide como máximo 1 por segundo.
let geoChain = Promise.resolve();
function geocode(q, extra = '&limit=6'){
  const run = async () => {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&namedetails=1&accept-language=es,en' + extra + '&q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('El buscador de lugares respondió ' + r.status);
    // el nombre en español (o inglés) en lugar del original: "Bangkok" y no "กรุงเทพมหานคร"
    const nm = x => { const d = x.namedetails || {}; return d['name:es'] || d['name:en'] || x.display_name?.split(',')[0]?.trim() || x.name; };
    return (await r.json()).map(x => ({ name: nm(x), local: x.name, full: x.display_name, lat: +x.lat, lon: +x.lon, importance: x.importance || 0, kind: x.addresstype || x.type }));
  };
  const p = geoChain.then(run);
  geoChain = p.catch(() => {}).then(() => sleep(1100));
  return p;
}

/* --- ciudades mencionadas en las descripciones ("hostel munich", "tren a brujas") --- */
const DESC_STOP = new Set(('supermercado super cafe cafes desayuno almuerzo cena cenas birra birras cerveza cervezas vino vinos papas pizza pizzas hostel hostels hostal ' +
  'hotel hoteles airbnb adelanto adelantos tren trenes metro uber taxi taxis bus buses bondi vuelo vuelos pasaje pasajes avion entrada entradas museo museos propina ' +
  'propinas agua comida comidas helado helados chocolate chocolates gofres frites castillo souvenir souvenirs regalo regalos compras farmacia tabaco puchos snacks kebab ' +
  'burger sushi shawarma bagel salmon fritebar bares boliche club fiesta parque tour tours free walking visita iglesia catedral palacio playa lago mercado feria tienda ' +
  'primark zara ropa medias gorro abrigo campera mochila valija lockers locker bano peaje nafta auto alquiler estacionamiento parking ticket tickets total pago pagos noche ' +
  'noches para desde hasta otro otros otra varios cosas algo mitad cada todo todos todas sola solo primera primer segundo segunda vuelta llegada salida aeropuerto estacion ' +
  'station gare train plane flight food drinks dinner lunch breakfast coffee beer wine water market shop shopping habitacion tarjeta datos internet leonidas australian ' +
  'souplounge flying tiger mcdo mcdonalds starbucks lidl aldi carrefour intermarche monoprix franprix supermarche boulangerie croissant crepe crepes pastas pasta ' +
  'gelato cappuccino aperol spritz picnic panaderia factura facturas lavanderia transfer navigo flixbus blablacar ryanair easyjet vueling iberia booking ' +
  'corte ingles china chino chinos barra barras nacional hungaro montaditos jamon medialunas micro saint casa sala bebida bebidas postre postres cine teatro ' +
  'opera show concierto torre puente plaza calle centro norte oeste este grande nuevo nueva viejo vieja santo santa noel navidad regalito').split(' '));
const kmBetween = (a, b) => { const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const PLACE_HINT = /(?:hostel|hostal|hotel|airbnb|tren(?:es)?|bus|vuelos?|flixbus|blablacar|metro|en|a|de|desde|hacia|to|en)\s+(?:a\s+|de\s+|en\s+|para\s+)?([a-z]{4,})/g;

function cityCandidates(origin){
  const ex = tripExpenses().filter(e => e.origin === origin);
  const skip = new Set([...DESC_STOP, ...STOPWORDS, ...S.people.flatMap(p => [p.keyword, ...p.aliases.flatMap(a => a.split(/\s+/))]).map(normTxt),
    ...normTxt(origin.replace(/^viaje\s*-\s*/i, '')).split(/\s+/)]);
  const c = {};
  for (const e of ex){
    const t = normTxt(e.desc);
    for (const w of new Set(t.match(/[a-z]{4,}/g) || [])){ if (skip.has(w)) continue; (c[w] ??= { w, n: 0, boost: 0, dates: [] }); c[w].n++; c[w].dates.push(e.date); }
    for (const m of t.matchAll(PLACE_HINT)) if (c[m[1]]) c[m[1]].boost++;
  }
  return Object.values(c).sort((a, b) => (b.n + 3 * b.boost) - (a.n + 3 * a.boost)).slice(0, 8);
}

/* Recorrido día por día: cada día del viaje toma la ciudad que más nombran sus gastos (ignorando los que
   nombran dos, tipo "bus viena-budapest"); los días sin menciones siguen en la ciudad anterior.
   De ahí salen las fechas desde/hasta de cada ciudad (su tramo más largo). */
function itinerary(list, ex, core){
  if (!core.from || !list.length) return;
  const addDays = (d, n) => new Date(Date.parse(d) + n * 864e5).toISOString().slice(0, 10);
  const days = Array.from({ length: core.days }, (_, i) => addDays(core.from, i));
  const votes = {};
  for (const e of ex){
    if (e.date < core.from || e.date > core.to) continue;
    const t = normTxt(e.desc), hits = list.filter(c => new RegExp('\\b' + c.w + '\\b').test(t));
    if (hits.length === 1) (votes[e.date] ??= {})[hits[0].name] = (votes[e.date]?.[hits[0].name] || 0) + 1;
  }
  let cur = null;
  const seq = days.map(d => { const v = votes[d]; if (v) cur = Object.entries(v).sort((a, b) => b[1] - a[1])[0][0]; return cur; });
  const first = seq.find(Boolean); for (let i = 0; i < seq.length && !seq[i]; i++) seq[i] = first;
  for (const c of list){
    let best = null, run = null;
    seq.forEach((n, i) => {
      if (n === c.name){ run = run ? { ...run, to: i } : { from: i, to: i }; if (!best || run.to - run.from > best.to - best.from) best = run; }
      else run = null;
    });
    c.from = best ? days[best.from] : ''; c.to = best ? days[best.to] : '';
  }
}

let detecting = null;
async function detectCities(origin){
  const ex = tripExpenses().filter(e => e.origin === origin);
  const core = tripCore(ex);
  const found = [];
  for (const cand of cityCandidates(origin)){
    let r;
    try { r = (await geocode(cand.w, '&limit=1&featureType=settlement'))[0]; } catch(e){ geoFailed = true; return null; }
    if (!r) continue;
    // el nombre encontrado tiene que parecerse a la palabra ("spezia" -> "La Spezia", "munich" -> "Múnich")
    const okName = normTxt(r.name).split(/[\s-]+/).some(p => p.startsWith(cand.w.slice(0, 4)));
    // palabras cortas ("dell", "casa") necesitan más evidencia, salvo que sea una ciudad conocida ("roma", "linz")
    const short = cand.w.length < 5 && cand.boost < 2 && r.importance < 0.55;
    if (!okName || short || r.importance < (cand.boost ? 0.35 : 0.45)) continue;
    if (found.some(f => f.name === r.name)) continue;
    const inTrip = cand.dates.filter(d => d >= core.from && d <= core.to).sort();
    found.push({ w: cand.w, name: r.name, full: r.full, lat: r.lat, lon: r.lon, mentions: cand.n, from: inTrip[0] || '', to: inTrip[inTrip.length - 1] || '' });
  }
  // descarta lo que queda lejísimos del resto del viaje (una palabra que casualmente es un pueblo de otro continente)
  let list = found;
  if (found.length >= 3){
    const med = k => pctl(found.map(f => f[k]), .5), c = { lat: med('lat'), lon: med('lon') };
    list = found.filter(f => kmBetween(f, c) < 1500);
  } else {
    // con pocas ciudades, se compara con el lugar propuesto por el nombre del viaje (si lo hay)
    const anchor = tripOf(origin)?.stops?.[0];
    if (anchor) list = found.filter(f => kmBetween(f, anchor) < 2500);
  }
  itinerary(list, ex, core);
  list.sort((a, b) => (a.from || '9999').localeCompare(b.from || '9999'));
  S.tripCities[origin] = { n: ex.length, list };
  save();
  return list;
}
async function detectAllCities(){
  if (detecting || geoFailed) return;
  const origins = [...new Set(tripExpenses().map(e => e.origin))];
  const todo = origins.filter(o => { const c = S.tripCities[o]; return !c || c.n !== tripExpenses().filter(e => e.origin === o).length; });
  if (!todo.length) return;
  detecting = true;
  for (const o of todo){
    if (geoFailed) break;
    await detectCities(o);
    if (view === 'viajes' && !$('#dlg').open) render();
  }
  detecting = null;
}
const pendingCities = origin => {
  const sug = S.tripCities[origin]; if (!sug || sug.dismissed) return [];
  const have = new Set((tripOf(origin)?.stops || []).map(s => s.name));
  return sug.list.filter(c => !have.has(c.name));
};
let proposing = false, geoFailed = false;
async function proposeLocations(){
  if (proposing || geoFailed) return;
  const pending = [...new Set(tripExpenses().map(e => e.origin))].filter(o => !S.trips[o]);
  if (!pending.length) return;
  proposing = true; if (view === 'viajes') render();
  for (const origin of pending){
    const base = origin.replace(/^viaje\s*-\s*/i, '').trim();
    const g = groupOf(origin);
    const cands = [...new Set([base, ...(g?.prefix || '').split(/[-_\s]+/), ...base.split(/\s+/)]
      .map(s => s.trim()).filter(s => s.length >= 3 && !STOPWORDS.has(s.toLowerCase())))].slice(0, 4);
    let best = null, failed = false;
    for (const q of cands){
      try { const r = (await geocode(q))[0]; if (r && (!best || r.importance > best.importance)) best = r; }
      catch(e){ failed = true; break; }
    }
    if (failed){ geoFailed = true; toast('No pude buscar ubicaciones (¿sin conexión?). Podés cargarlas a mano.'); break; }
    S.trips[origin] = { stops: best ? [{ name: best.name, full: best.full, lat: best.lat, lon: best.lon, from: '', to: '' }] : [], confirmed: false };
    save();
    if (view === 'viajes' && !$('#dlg').open) render();
  }
  proposing = false;
  if (view === 'viajes' && !$('#dlg').open) render();
  detectAllCities();
}

let leafletP = null, tripMap = null;
function loadLeaflet(){
  return leafletP ??= new Promise((res, rej) => {

    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => res(window.L); s.onerror = () => { leafletP = null; rej(new Error('offline')); }; document.head.appendChild(s);
