/* alojamientos de cada ciudad: lo elegido, las alternativas sin elegir, o el botón para agregar */
const cityLodgings = (plan, cityId, pid = curProp(plan)) => pItems(plan, pid).filter(i => i.rubro === 'alojamiento' && i.cityId === cityId);
function lodgingChipsHtml(plan, c){
  const ls = cityLodgings(plan, c.id);
  if (!ls.length) return nightsOf(c) ? `<button class="lodg-chip warn" data-add-lodging="${c.id}">🛏️ Sin alojamiento · <b>+ agregar opciones</b></button>` : '';
  return ls.map(it => {
    const ch = chosenOpt(it), n = it.options.length, c0 = itemCost(plan, it), st = ESTADOS.find(s => s.id === (it.status || 'presupuestado'));
    const price = c0.priced ? ` · ${fmtRange(c0.min.pp, c0.max.pp)}/p` : '';
    return ch ? `<button class="lodg-chip ${st.cls}" data-edit-item="${it.id}" title="Ver o cambiar el alojamiento">🛏️ <b>${esc(ch.label || it.title)}</b>${price} · <span class="st-txt">${st.label}</span>${n > 1 ? ` <span class="muted">(de ${n})</span>` : ''}</button>`
      : `<button class="lodg-chip undec" data-edit-item="${it.id}" title="Comparar y elegir">🛏️ ${n} opciones sin elegir${price} · <b>Elegir</b></button>`;
  }).join('');
}
function bindLodgingChips(root, plan){
  root.querySelectorAll('[data-edit-item]').forEach(b => b.onclick = () => editItemDialog(plan, plan.items.find(i => i.id === b.dataset.editItem)));
  root.querySelectorAll('[data-add-lodging]').forEach(b => b.onclick = () => editItemDialog(plan, null, { rubro: 'alojamiento', cityId: b.dataset.addLodging }));
}

function planCiudades(body, plan){
  const cs = pCities(plan).slice().sort((a, b) => (a.from || '').localeCompare(b.from || ''));
  const hp = hasProps(plan);
  body.innerHTML = `<div class="panel" style="padding:0;overflow:hidden"><div id="planMap" style="height:400px"></div><div class="map-legend small" id="planMapLegend"></div></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Itinerario${hp ? ` <span class="muted small">— propuesta ${propLetter(plan, curProp(plan))}</span>` : ''}</h2><button class="btn sec small-btn" id="addCity">+ Ciudad</button></div>
    <p class="small muted">Las ciudades con sus fechas de llegada y salida. Con esto se calculan las noches de alojamiento y los días de gastos diarios.${hp ? ' Marcá en qué propuestas está cada ciudad: si una propuesta pasa más días en un lugar, cargá esa ciudad aparte solo para ella.' : ''}</p>
    ${cs.map(c => `<div class="stop"><div><b>${esc(c.name)}</b>${propTag(plan, c)}<div class="small muted">${esc(c.full || 'sin ubicación en el mapa')}</div></div>
      <label class="small">llegada <input type="date" data-cf="${c.id}|from" value="${c.from || ''}"></label>
      <label class="small">salida <input type="date" data-cf="${c.id}|to" value="${c.to || ''}"></label>
      <span class="small muted">${nightsOf(c)} noche${nightsOf(c) !== 1 ? 's' : ''}</span>
      ${hp ? `<span class="pp-chips">${plan.proposals.map(p => `<label class="check small" title="${esc(p.name)}"><input type="checkbox" data-cp="${c.id}|${p.id}" ${inProp(c, p.id) ? 'checked' : ''}>${propLetter(plan, p.id)}</label>`).join('')}</span>` : ''}
      <button class="icon" data-cdup="${c.id}" title="Copiar esta ciudad para otra propuesta (con otras fechas)">⧉</button>
      <button class="icon" data-cdel="${c.id}" title="Quitar">✕</button>
      <div class="stop-lodg">${lodgingChipsHtml(plan, c)}</div></div>`).join('') || '<p class="muted">Todavía no hay ciudades.</p>'}
    <div id="cityAdd" style="display:none;margin-top:10px"><div class="row" style="flex-wrap:nowrap"><input id="cityQ" placeholder="Ciudad, país…" style="flex:1"><button class="btn sec" id="cityBtn">Buscar</button></div><div id="cityRes" class="geo-res" style="margin-top:6px"></div></div>
  </div>`;
  const city = id => plan.cities.find(c => c.id === id);
  body.querySelectorAll('[data-cf]').forEach(inp => inp.onchange = () => { const [id, k] = inp.dataset.cf.split('|'); city(id)[k] = inp.value; save(); render(); });
  body.querySelectorAll('[data-cp]').forEach(inp => inp.onchange = () => {
    const [id, pid] = inp.dataset.cp.split('|'), c = city(id);
    const cur = plan.proposals.filter(p => inProp(c, p.id)).map(p => p.id);
    const next = inp.checked ? [...new Set([...cur, pid])] : cur.filter(x => x !== pid);
    if (!next.length){ inp.checked = true; toast('La ciudad tiene que estar en al menos una propuesta (o borrala con ✕)'); return; }
    if (next.length === plan.proposals.length) delete c.props; else c.props = next;
    save(); render();
  });
  body.querySelectorAll('[data-cdup]').forEach(b => b.onclick = () => {
    const c = city(b.dataset.cdup), copy = { ...JSON.parse(JSON.stringify(c)), id: uid(), props: defaultProps(plan) };
    if (hp && !Array.isArray(c.props)) c.props = plan.proposals.map(p => p.id).filter(id => id !== curProp(plan));   // la original sale de la propuesta actual
    plan.cities.push(copy); save(); render(); toast(`Copia de ${c.name} en esta propuesta: cambiale las fechas`);
  });
  body.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => { plan.cities = plan.cities.filter(c => c.id !== b.dataset.cdel); save(); render(); });
  bindLodgingChips(body, plan);
  $('#addCity').onclick = () => { $('#cityAdd').style.display = ''; $('#cityQ').focus(); };
  const last = cs[cs.length - 1];
  const addCity = r => { plan.cities.push({ id: uid(), name: r.name, full: r.full || '', lat: r.lat, lon: r.lon, from: last?.to || plan.from || '', to: '', daily: {}, props: defaultProps(plan) }); save(); render(); };
  const search = async () => {
    const q = $('#cityQ').value.trim(); if (!q) return;
    $('#cityRes').innerHTML = '<p class="small muted">Buscando…</p>';
    try {
      const rs = await geocode(q, '&limit=5&featureType=settlement');
      $('#cityRes').innerHTML = (rs.length ? rs.map((r, i) => `<button class="geo-opt" data-r="${i}"><b>${esc(r.name)}</b> <span class="muted small">${esc(r.full)}</span></button>`).join('') : '')
        + `<button class="geo-opt" data-r="-1">Usar "${esc(q)}" sin ubicación en el mapa</button>`;
      $('#cityRes').querySelectorAll('[data-r]').forEach(b => b.onclick = () => addCity(+b.dataset.r >= 0 ? rs[+b.dataset.r] : { name: q }));
    } catch(e){ addCity({ name: q }); }
  };
  $('#cityBtn').onclick = search; $('#cityQ').onkeydown = e => { if (e.key === 'Enter') search(); };
  drawPlanMap(plan);
}

/* ---------- diálogos ---------- */
function editPlanDialog(plan){
  const isNew = !plan;
  const p = plan ? JSON.parse(JSON.stringify(plan)) : { id: uid(), name: '', from: '', to: '', color: TRIP_COLORS[planList().length % TRIP_COLORS.length],
    travelers: S.people.map(x => ({ id: uid(), name: x.name, personId: x.id })), cities: [], items: [] };
  const dlg = $('#dlg');
  const draw = () => {
    dlg.innerHTML = `<form method="dialog" style="width:min(480px,86vw)"><h3>${isNew ? 'Nuevo plan de viaje' : 'Datos del plan'}</h3>
      <div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" placeholder="Ej.: Japón 2027" required></div>
      <div class="row"><div class="field"><label>Desde</label><input type="date" name="from" value="${p.from}"></div><div class="field"><label>Hasta</label><input type="date" name="to" value="${p.to}"></div>
        <div class="field"><label>Color</label><input type="color" name="color" value="${p.color}" class="tcolor" style="width:40px;height:32px"></div></div>
      <div class="field"><label>Viajeros (los costos se dividen entre ellos)</label>
        ${p.travelers.map((x, i) => `<div class="row" style="flex-wrap:nowrap;margin-bottom:4px"><input data-tn="${i}" value="${esc(x.name)}" style="flex:1">${x.personId ? '<span class="small muted">de la app</span>' : ''}
          ${p.travelers.length > 1 ? `<button type="button" class="icon" data-tdel="${i}">✕</button>` : ''}</div>`).join('')}
        <button type="button" class="btn sec small-btn" id="tAdd">+ Viajero</button></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">${isNew ? 'Crear plan' : 'Guardar'}</button></div></form>`;
    const sync = () => { dlg.querySelectorAll('[data-tn]').forEach(inp => p.travelers[+inp.dataset.tn].name = inp.value); const f = dlg.querySelector('form'); p.name = f.name.value; p.from = f.from.value; p.to = f.to.value; p.color = f.color.value; };
    dlg.querySelector('#tAdd').onclick = () => { sync(); p.travelers.push({ id: uid(), name: '' }); draw(); dlg.querySelector(`[data-tn="${p.travelers.length - 1}"]`).focus(); };
    dlg.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => { sync(); p.travelers.splice(+b.dataset.tdel, 1); draw(); });
    whenClosed(dlg, v => {
      if (v !== 'ok') return;
      sync(); p.travelers = p.travelers.filter(x => x.name.trim());
      if (!p.travelers.length) p.travelers = [{ id: uid(), name: 'Yo' }];
      // si sacaron viajeros, se los saca también de los ítems que se dividían entre algunos
      const ids = new Set(p.travelers.map(x => x.id));
      for (const it of p.items) if (Array.isArray(it.split)){ it.split = it.split.filter(id => ids.has(id)); if (!it.split.length) it.split = 'all'; }
      S.plans[p.id] = p; save(); ui.plan = { id: p.id, tab: isNew ? 'ciudades' : ui.plan.tab }; render();
    });
  };
  draw(); dlg.showModal();
}

/* ---------- alternativas: cada opción es una propuesta completa (precio, fecha, horario, compañía…) ---------- */
const OPT_FIELDS = {
  transporte: [['label', 'Compañía / opción', 'Vueling'], ['mode', 'Medio', 'Avión'], ['date', 'Fecha', '', 'date'], ['time', 'Sale', '06:20'], ['arr', 'Llega', '08:00'], ['dur', 'Duración', 'auto']],
  alojamiento: [['label', 'Nombre', 'Generator Hostel'], ['kind', 'Tipo', 'hostel, airbnb…'], ['checkIn', 'Entrada', '', 'date'], ['checkOut', 'Salida', '', 'date']],
  actividad: [['label', 'Opción', 'Entrada general'], ['date', 'Fecha', '', 'date'], ['time', 'Hora', '10:00']],
  otro: [['label', 'Opción', ''], ['date', 'Fecha', '', 'date']],
};
const chosenOpt = it => it.options?.find(o => o.id === it.chosen) || (it.options?.length === 1 ? it.options[0] : null);
const eff = (it, k) => chosenOpt(it)?.[k] || it[k] || '';
// duración a partir de los horarios (si cruza la medianoche, suma un día)
function durOf(o){
  if (o.dur) return o.dur;
  const m = s => { const x = /^(\d{1,2})[:.h](\d{2})$/.exec((s || '').trim()); return x ? +x[1] * 60 + +x[2] : null; };
  const a = m(o.time), b = m(o.arr); if (a == null || b == null) return '';
  const d = (b - a + 1440) % 1440; return `${Math.floor(d / 60)}h ${String(d % 60).padStart(2, '0')}`;
}
function optWhen(it, o){
  if (it.rubro === 'alojamiento') return o.checkIn && o.checkOut ? `${fmtDay(o.checkIn)} → ${fmtDay(o.checkOut)} · ${daysBetween(o.checkIn, o.checkOut) - 1} noches` : '';
  return [o.date ? fmtDay(o.date) : '', o.time ? (o.arr ? `${o.time}–${o.arr}` : o.time) : '', durOf(o)].filter(Boolean).join(' · ');
}
// las opciones viejas guardaban fecha/horario en el ítem: se pasan a cada opción
function normalizeItem(it){
  for (const o of it.options || []) for (const [k] of OPT_FIELDS[it.rubro] || []) if (!o[k] && it[k] && k !== 'label') o[k] = it[k];
  return it;
}
const itemSortKey = it => { const ds = (it.options || []).map(o => o.date || o.checkIn).filter(Boolean).sort(); return eff(it, 'date') || eff(it, 'checkIn') || ds[0] || '9'; };

function planItems(body, plan){
  const cityName = id => plan.cities.find(c => c.id === id)?.name || '';
  (plan.items || []).forEach(normalizeItem);
  body.innerHTML = RUBROS.map(r => {
    const its = pItems(plan).filter(i => i.rubro === r.id).sort((a, b) => itemSortKey(a).localeCompare(itemSortKey(b)));
    const sum = its.reduce((a, i) => { const c = itemCost(plan, i); return [a[0] + c.min.total, a[1] + c.max.total]; }, [0, 0]);
    return `<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${r.icon} ${r.label} <span class="muted small">— ${fmtRange(sum[0], sum[1])} en total</span></h2>
      <button class="btn sec small-btn" data-new="${r.id}">+ Agregar</button></div>
      ${its.length ? `<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Estado</th><th>${r.id === 'transporte' ? 'Tramo' : 'Qué'}</th><th>Opción elegida / alternativas</th><th class="num">Total</th><th class="num">Por persona</th><th>Dividido</th><th></th></tr></thead><tbody>
      ${its.map(it => { const c = itemCost(plan, it), ch = chosenOpt(it), many = (it.options || []).length > 1;
        return `<tr>
          <td><select class="stsel ${ESTADOS.find(s => s.id === (it.status || 'presupuestado')).cls}" data-status="${it.id}">${ESTADOS.map(s => `<option value="${s.id}" ${(it.status || 'presupuestado') === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}</select></td>
          <td class="desc"><b>${esc(itemName(it))}</b>${propTag(plan, it)}${it.cityId && it.rubro !== 'transporte' ? `<span class="orig">${esc(cityName(it.cityId))}</span>` : ''}${it.notes ? `<span class="orig" title="${esc(it.notes)}">📝 ${esc(it.notes.slice(0, 50))}${it.notes.length > 50 ? '…' : ''}</span>` : ''}</td>
          <td class="desc">${ch ? `<b>${esc(ch.label || 'elegida')}</b>${ch.mode ? ` · ${esc(ch.mode)}` : ''}${many ? ` <span class="muted small">(de ${it.options.length})</span>` : ''}${ch.link ? ` <a href="${esc(ch.link)}" target="_blank" rel="noopener" title="Abrir link">🔗</a>` : ''}<span class="orig">${esc(optWhen(it, ch))}</span>`
            : `<span class="status warn">${it.options.length} alternativas sin elegir</span>${it.options.map(o => `<span class="orig">• ${esc(o.label || 'opción')}${optWhen(it, o) ? ' · ' + esc(optWhen(it, o)) : ''}${o.cost !== '' && o.cost != null ? ' · ' + eur(optCost(plan, it, o).pp) + '/p' : ''}</span>`).join('')}`}</td>
          <td class="num">${c.priced ? fmtRange(c.min.total, c.max.total) : '<span class="muted">sin precio</span>'}</td>
          <td class="num">${c.priced ? fmtRange(c.min.pp, c.max.pp) : ''}</td>
          <td class="muted small">${it.split === 'all' || !Array.isArray(it.split) ? 'todos' : it.split.map(id => esc(plan.travelers.find(x => x.id === id)?.name || '')).join(', ')}</td>
          <td><button class="icon" data-edit-item="${it.id}" title="Editar y comparar alternativas">✎</button></td></tr>`; }).join('')}
      </tbody></table></div>` : `<p class="muted small" style="margin:8px 0 0">Todavía no hay ${r.label.toLowerCase()}.</p>`}</div>`; }).join('');
  body.querySelectorAll('[data-new]').forEach(b => b.onclick = () => editItemDialog(plan, null, { rubro: b.dataset.new }));
  body.querySelectorAll('[data-edit-item]').forEach(b => b.onclick = () => editItemDialog(plan, plan.items.find(i => i.id === b.dataset.editItem)));
  body.querySelectorAll('[data-status]').forEach(sel => sel.onchange = () => { plan.items.find(i => i.id === sel.dataset.status).status = sel.value; save(); render(); });
}

function editItemDialog(plan, item, preset = {}){
  const isNew = !item;
  const blankOpt = () => ({ id: uid(), label: '', cost: '', link: '', notes: '' });
  const it = item ? normalizeItem(JSON.parse(JSON.stringify(item))) : { id: uid(), rubro: 'transporte', status: 'presupuestado', split: 'all', costMode: 'total', options: [blankOpt()], chosen: null, props: defaultProps(plan), ...preset };
  if (isNew && it.rubro === 'transporte') it.costMode = 'pp';
  if (isNew && it.rubro === 'alojamiento' && it.cityId){ const c = plan.cities.find(x => x.id === it.cityId); if (c){ it.title = 'Alojamiento en ' + c.name; Object.assign(it.options[0], { checkIn: c.from, checkOut: c.to }); } }
  const dlg = $('#dlg');
  const draw = () => {
    const r = it.rubro, fields = OPT_FIELDS[r], many = it.options.length > 1;
    const costs = it.options.map(o => o.cost === '' || o.cost == null ? null : optCost(plan, it, o));
    const cheapest = Math.min(...costs.filter(Boolean).map(c => c.total));
    dlg.innerHTML = `<form method="dialog" style="width:min(860px,92vw)"><h3>${RUBROS.find(x => x.id === r).icon} ${isNew ? 'Nuevo' : 'Editar'}: ${RUBROS.find(x => x.id === r).label}</h3>
      <div class="row">
        ${isNew ? `<div class="field"><label>Rubro</label><select name="rubro">${RUBROS.map(x => `<option value="${x.id}" ${x.id === r ? 'selected' : ''}>${x.label}</option>`).join('')}</select></div>` : ''}
        ${r === 'transporte' ? `<div class="field"><label>Desde</label><input name="fromPlace" value="${esc(it.fromPlace || '')}" placeholder="París"></div>
            <div class="field"><label>Hasta</label><input name="toPlace" value="${esc(it.toPlace || '')}" placeholder="Barcelona"></div>`
          : `<div class="field" style="flex:1"><label>${r === 'alojamiento' ? 'Qué / dónde' : 'Qué'}</label><input name="title" value="${esc(it.title || '')}" placeholder="${r === 'alojamiento' ? 'Alojamiento en Bilbao' : r === 'actividad' ? 'Museo Guggenheim' : 'Seguro de viaje'}"></div>`}
        ${r !== 'otro' && r !== 'transporte' && plan.cities.length ? `<div class="field"><label>Ciudad</label><select name="cityId"><option value="">—</option>${plan.cities.filter(c => inProp(c, curProp(plan)) || c.id === it.cityId).map(c => `<option value="${c.id}" ${it.cityId === c.id ? 'selected' : ''}>${esc(c.name)}${c.from ? ` (${fmtDay(c.from)})` : ''}</option>`).join('')}</select></div>` : ''}
        <div class="field"><label>Estado</label><select name="status">${ESTADOS.map(s => `<option value="${s.id}" ${(it.status || 'presupuestado') === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1"><label>Se divide entre</label><div class="row" style="gap:10px">${plan.travelers.map(x => `<label class="check"><input type="checkbox" data-sp="${x.id}" ${travIn(plan, it, x.id) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('')}</div></div>
      </div>
      ${many ? `<div class="field"><label>Comparar alternativas</label><div class="table-wrap"><table class="cmp"><thead><tr><th></th><th>Opción</th><th>${r === 'alojamiento' ? 'Fechas' : 'Cuándo'}</th><th class="num">Total</th><th class="num">Por persona</th><th></th></tr></thead><tbody>
        ${it.options.map((o, i) => `<tr class="${it.chosen === o.id ? 'on' : ''}"><td>${it.chosen === o.id ? '✓' : ''}</td><td><b>${esc(o.label || `Opción ${i + 1}`)}</b>${o.mode ? ` <span class="muted small">${esc(o.mode)}</span>` : ''}</td>
          <td class="small">${esc(optWhen(it, o)) || '<span class="muted">–</span>'}</td>
          <td class="num">${costs[i] ? eur(costs[i].total) : '–'}${costs[i] && costs[i].total === cheapest ? ' <span class="tag">la más barata</span>' : ''}</td><td class="num">${costs[i] ? eur(costs[i].pp) : ''}</td>
          <td>${it.chosen === o.id ? '<button type="button" class="btn sec small-btn" data-unpick>Quitar elección</button>' : `<button type="button" class="btn small-btn" data-pick="${o.id}">Elegir</button>`}</td></tr>`).join('')}
        </tbody></table></div></div>` : ''}
      <div class="field"><label>${many ? 'Detalle de cada alternativa' : 'Detalle'}</label>
        <div class="opt-cards">${it.options.map((o, i) => `<div class="opt-card ${it.chosen === o.id ? 'on' : ''}">
          <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="small">${many ? `Alternativa ${i + 1}${it.chosen === o.id ? ' · elegida' : ''}` : 'Opción'}</b>
            <span><button type="button" class="icon" data-odup="${i}" title="Duplicar para armar otra alternativa parecida">⧉</button>${many ? `<button type="button" class="icon" data-odel="${i}" title="Quitar">✕</button>` : ''}</span></div>
          <div class="opt-grid">
            ${fields.map(([k, label, ph, type]) => `<label class="small">${label}<input ${type === 'date' ? 'type="date"' : ''} data-o="${i}|${k}" value="${esc(o[k] || '')}" placeholder="${k === 'dur' ? durOf({ ...o, dur: '' }) || ph : ph}" ${k === 'mode' ? 'list="modes"' : ''}></label>`).join('')}
            <label class="small">Precio (€)<input type="number" step="0.01" data-o="${i}|cost" value="${o.cost}" placeholder="€"></label>
            <label class="small">El precio es<select data-o="${i}|costMode"><option value="pp" ${(o.costMode || it.costMode) === 'pp' ? 'selected' : ''}>por persona</option><option value="total" ${(o.costMode || it.costMode) !== 'pp' ? 'selected' : ''}>total (se divide)</option></select></label>
          </div>
          <div class="opt-grid wide"><label class="small">Link<input data-o="${i}|link" value="${esc(o.link || '')}" placeholder="https://…"></label>
            <label class="small">Notas<input data-o="${i}|notes" value="${esc(o.notes || '')}" placeholder="equipaje incluido, cancelación gratis…"></label></div>
        </div>`).join('')}</div>
        <datalist id="modes"><option>Avión</option><option>Tren</option><option>Bus</option><option>Auto</option><option>Barco</option></datalist>
        <button type="button" class="btn sec small-btn" id="oAdd" style="margin-top:8px">+ Agregar alternativa</button></div>
      ${propPickerHtml(plan, it)}
      <div class="field"><label>Notas generales</label><input name="notes" value="${esc(it.notes || '')}" placeholder="Ej.: hay buses que salen del aeropuerto directamente"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        ${!isNew ? '<button class="btn danger" value="del" formnovalidate>Borrar</button>' : ''}
        <button class="btn sec" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Guardar</button></div></form>`;
    const f = dlg.querySelector('form');
    const sync = () => {
      for (const k of ['fromPlace', 'toPlace', 'title', 'cityId', 'status', 'notes']) if (f.elements[k]) it[k] = f.elements[k].value;
      readPropPicker(plan, dlg, it);
      dlg.querySelectorAll('[data-o]').forEach(inp => { const [i, k] = inp.dataset.o.split('|'); it.options[+i][k] = k === 'cost' ? (inp.value === '' ? '' : +inp.value) : inp.value; });
      const sp = [...dlg.querySelectorAll('[data-sp]')].filter(x => x.checked).map(x => x.dataset.sp);
      it.split = sp.length === plan.travelers.length || !sp.length ? 'all' : sp;
    };
    const redraw = () => { const y = dlg.scrollTop; sync(); draw(); dlg.scrollTop = y; };
    f.elements.rubro && (f.elements.rubro.onchange = () => { sync(); it.rubro = f.elements.rubro.value; if (it.rubro === 'transporte') it.costMode = 'pp'; draw(); });
    dlg.querySelectorAll('[data-o$="|costMode"]').forEach(s => s.addEventListener('change', redraw));
    // al cambiar un precio o un horario se actualiza la comparación
    dlg.querySelectorAll('[data-o$="|cost"], [data-o$="|time"], [data-o$="|arr"], [data-o$="|date"], [data-o$="|checkIn"], [data-o$="|checkOut"], [data-o$="|label"]').forEach(inp => inp.addEventListener('change', redraw));
    dlg.querySelector('#oAdd').onclick = () => { sync(); const prev = it.options[it.options.length - 1]; it.options.push({ ...blankOpt(), costMode: prev?.costMode || it.costMode }); draw(); dlg.scrollTop = dlg.scrollHeight; };
    dlg.querySelectorAll('[data-odup]').forEach(b => b.onclick = () => { sync(); const src = it.options[+b.dataset.odup]; it.options.splice(+b.dataset.odup + 1, 0, { ...src, id: uid(), label: src.label ? src.label + ' (otra)' : '' }); draw(); });
    dlg.querySelectorAll('[data-odel]').forEach(b => b.onclick = () => { sync(); const o = it.options.splice(+b.dataset.odel, 1)[0]; if (it.chosen === o.id) it.chosen = null; draw(); });
    dlg.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { sync(); it.chosen = b.dataset.pick; draw(); });
    dlg.querySelector('[data-unpick]') && (dlg.querySelector('[data-unpick]').onclick = () => { sync(); it.chosen = null; draw(); });
    whenClosed(dlg, v => {
      if (v === 'del'){ if (confirm('¿Borrar este ítem?')){ plan.items = plan.items.filter(x => x.id !== it.id); save(); render(); } return; }
      if (v !== 'ok') return;
      sync();
      if (it.options.length === 1) it.chosen = it.options[0].id;
      if (it.chosen && !it.options.some(o => o.id === it.chosen)) it.chosen = null;
      // el ítem guarda los datos de la opción elegida (para ordenar y mostrar)
      const ch = chosenOpt(it) || it.options[0];
      for (const [k] of OPT_FIELDS[it.rubro]) if (k !== 'label') it[k] = ch?.[k] || '';
      const i = plan.items.findIndex(x => x.id === it.id);
      if (i >= 0) plan.items[i] = it; else plan.items.push(it);
      save(); render();
    });
  };
  draw(); dlg.showModal();
}

/* ---------- ejemplo: el presupuesto de España (Presupuesto españa.xlsx) ---------- */
function examplePlan(){
  const id = uid(), [F, N] = [uid(), uid()];
  const city = (name, full, lat, lon, from, to, daily) => ({ id: uid(), name, full, lat, lon, from, to, daily });
  const cities = [
    city('Tossa de Mar', 'Tossa de Mar, Girona, Cataluña, España', 41.72, 2.93, '2026-08-08', '2026-08-10', { comida: 20, transporte: 2 }),
    city('Barcelona', 'Barcelona, Cataluña, España', 41.39, 2.17, '2026-08-10', '2026-08-13', { comida: 20, transporte: 3 }),
    city('San Sebastián', 'San Sebastián, Guipúzcoa, País Vasco, España', 43.32, -1.98, '2026-08-13', '2026-08-15', { comida: 20, transporte: 2 }),
    city('Bilbao', 'Bilbao, Vizcaya, País Vasco, España', 43.26, -2.93, '2026-08-15', '2026-08-20', { comida: 20, transporte: 2 }),
  ];
  const [tossa, bcn, ss, bil] = cities.map(c => c.id);
  const opt = (label, cost, notes = '') => ({ id: uid(), label, cost, link: '', notes });
  const tr = (fromPlace, toPlace, mode, label, date, time, cost, status, notes = '', arr = '') => { const o = { ...opt(label, cost), mode, date, time, arr }; return { id: uid(), rubro: 'transporte', fromPlace, toPlace, mode, date, time, status, split: 'all', costMode: 'pp', options: [o], chosen: o.id, notes }; };
  const lo = (title, cityId, checkIn, checkOut, options, status, chosenIdx, notes = '') => { const os = options.map(([l, c, n, ci, co]) => ({ ...opt(l, c, n), checkIn: ci || checkIn, checkOut: co || checkOut })); return { id: uid(), rubro: 'alojamiento', title, cityId, checkIn, checkOut, status, split: 'all', costMode: 'total', options: os, chosen: chosenIdx == null ? null : os[chosenIdx].id, notes }; };
  const items = [
    tr('París', 'Barcelona', 'Avión', 'Vueling', '2026-08-08', '06:20', 93, 'pagado', 'Estimado 85 €'),
    tr('Barcelona', 'Tossa de Mar', 'Bus', 'Moventis', '2026-08-08', 'mañana', 15, 'presupuestado', 'Hay buses que salen del aeropuerto directamente'),
    tr('Tossa de Mar', 'Barcelona', 'Bus', 'Moventis', '2026-08-10', 'mañana', 13, 'presupuestado', 'Considerar hacer day trip desde Barcelona a Girona'),
    tr('Barcelona', 'San Sebastián', 'Avión', 'Vueling', '2026-08-13', '07:10', 30.04, 'pagado', 'El bus tarda muchísimo'),
    tr('San Sebastián', 'Bilbao', 'Bus', 'Alsa', '2026-08-15', '21:00', 8, 'presupuestado'),
    tr('Bilbao', 'París', 'Avión', 'Transavia', '2026-08-20', '08:55', 55, 'pagado'),
    lo('Manà Manà Hostel', tossa, '2026-08-08', '2026-08-10', [['Manà Manà Hostel', 169.98, 'Habitación de 6 personas']], 'pagado', 0),
    lo('Generator Hostel', bcn, '2026-08-10', '2026-08-13', [['Generator Hostel', 199.98]], 'pagado', 0),
    // San Sebastián no estaba resuelto en el Excel: se cargan alternativas de muestra para probar la comparación
    lo('Alojamiento en San Sebastián', ss, '2026-08-13', '2026-08-15', [['Hostel en el centro (ejemplo)', 180, 'muy caro, minimizar noches'], ['Airbnb en Gros (ejemplo)', 230], ['Dormir en Bilbao y hacer day trip (ejemplo)', 0, '+ bus ida y vuelta']], 'presupuestado', null, 'El alojamiento es carísimo en San Sebastián, minimizar la cantidad de noches'),
    lo('Quartier Bilbao Hostel', bil, '2026-08-15', '2026-08-20', [['Quartier Bilbao Hostel', 259.94]], 'reservado', 0),
    { id: uid(), rubro: 'actividad', title: 'Sagrada Familia', cityId: bcn, date: '2026-08-11', status: 'presupuestado', split: 'all', costMode: 'pp', options: [opt('Entrada', 15)], chosen: null, notes: '' },
    { id: uid(), rubro: 'actividad', title: 'Museo Guggenheim', cityId: bil, date: '2026-08-17', status: 'presupuestado', split: 'all', costMode: 'pp', options: [opt('Entrada', 18)], chosen: null, notes: '' },
    { id: uid(), rubro: 'actividad', title: 'San Juan de Gaztelugatxe', cityId: bil, date: '2026-08-18', status: 'presupuestado', split: 'all', costMode: 'pp', options: [opt('Bus ida y vuelta', 10)], chosen: null, notes: '' },
  ];
  items.forEach(i => { if (i.options.length === 1) i.chosen = i.options[0].id; });
  // alternativa de muestra: el mismo tramo en otro medio, otro día y otro horario
  const ssBil = items.find(i => i.fromPlace === 'San Sebastián' && i.toPlace === 'Bilbao');
  ssBil.options.push({ id: uid(), label: 'Euskotren (ejemplo)', mode: 'Tren', date: '2026-08-16', time: '10:15', arr: '12:55', cost: 3.5, link: '', notes: 'más lento pero barato; implica una noche más en San Sebastián' });
  ssBil.chosen = null;
  // dos propuestas: A = la del Excel (con Tossa) · B = sin Tossa, 5 noches en Barcelona (ejemplo)
  const A = uid(), B = uid();
  const onlyA = x => { x.props = [A]; return x; };
  cities.find(c => c.id === tossa).props = [A];
  cities.find(c => c.id === bcn).props = [A];
  items.filter(i => (i.fromPlace === 'Barcelona' && i.toPlace === 'Tossa de Mar') || (i.fromPlace === 'Tossa de Mar' && i.toPlace === 'Barcelona')
    || i.cityId === tossa || (i.rubro === 'alojamiento' && i.cityId === bcn)).forEach(onlyA);
  const bcnB = { id: uid(), name: 'Barcelona', full: 'Barcelona, Cataluña, España', lat: 41.39, lon: 2.17, from: '2026-08-08', to: '2026-08-13', daily: { comida: 20, transporte: 3 }, props: [B] };
  cities.push(bcnB);
  const genB = { id: uid(), label: 'Generator Hostel', cost: 333.30, link: '', notes: '5 noches (ejemplo)', checkIn: '2026-08-08', checkOut: '2026-08-13' };
  items.push({ id: uid(), rubro: 'alojamiento', title: 'Generator Hostel', cityId: bcnB.id, status: 'presupuestado', split: 'all', costMode: 'total', options: [genB], chosen: genB.id, notes: '', props: [B] });
  items.filter(i => i.rubro === 'actividad' && i.cityId === bcn).forEach(i => i.cityId = '');   // la Sagrada Familia está en las dos
  return { id, example: true, name: 'España ago 26', from: '2026-08-08', to: '2026-08-20', color: '#e34948',
    travelers: [{ id: F, name: 'Franco', personId: 'FRANCO' }, { id: N, name: 'Noah', personId: 'NOAH' }], cities, items,
    proposals: [{ id: A, name: 'Con Tossa de Mar (Excel)' }, { id: B, name: 'Sin Tossa, 5 noches en Barcelona' }], chosenProposal: null };
}

/* ---------- Lista de gastos ---------- */
function renderGastos(main){
  const F = ui.filters;
  const all = allEnriched();
  const months = [...new Set(all.map(e => monthOf(e.date)))].sort().reverse();
  const origins = [...new Set(all.map(e => e.origin))].sort();
  const q = F.q.trim().toLowerCase();
  const list = all.filter(e =>
    (!F.month || monthOf(e.date) === F.month) && (!F.origin || e.origin === F.origin) && (!F.simp || e.simp === F.simp) &&
    (!q || e.desc.toLowerCase().includes(q) || e.cat.toLowerCase().includes(q)) &&
    (!F.person || e.sharesEUR[F.person]) && (!F.onlyIssues || e.issue) && (F.showExcluded || !e.excluded));
  const sum = pid => list.filter(e=>!e.excluded).reduce((a,e)=>a+e.sharesEUR[pid],0);
  const issues = all.filter(e => e.issue).length;
  const LIMIT = 500;
  main.innerHTML = `
  ${issues?`<div class="banner">⚠️ Hay ${issues} gasto(s) que no quedaron asignados a nadie (saldo 0 y la descripción no nombra a ninguno). <a href="#" id="seeIssues">Ver y corregir</a></div>`:''}
  <div class="panel">
  <div class="toolbar">
    <div class="filters">
      <input id="fQ" type="search" placeholder="🔍 Buscar descripción…" value="${esc(F.q)}">
      <select id="fMonth"><option value="">Todos los meses</option>${months.map(m=>`<option value="${m}" ${F.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select>
      <select id="fOrigin"><option value="">Todos los orígenes</option>${origins.map(o=>`<option ${F.origin===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
      <select id="fSimp"><option value="">Todas las categorías</option>${S.simpCats.map(c=>`<option ${F.simp===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="fPerson"><option value="">Cualquier persona</option>${S.people.map(p=>`<option value="${p.id}" ${F.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    </div>
    <button class="btn" id="addManual">+ Gasto manual</button>
  </div>
  <div class="toolbar sub">
    <div class="row">
      <label class="check"><input type="checkbox" id="fExcl" ${F.showExcluded?'checked':''}> Mostrar pagos y descartados</label>
      <label class="check"><input type="checkbox" id="fIssues" ${F.onlyIssues?'checked':''}> Solo sin asignar</label>
      ${F.q||F.month||F.origin||F.simp||F.person||F.onlyIssues||F.showExcluded ? '<button class="btn sec small-btn" id="clearF">✕ Limpiar filtros</button>' : ''}
    </div>
    <div class="muted small">${list.length} gastos · ${S.people.map(p=>`${esc(p.name)}: <b>${eur(sum(p.id))}</b>`).join(' · ')}${list.length>LIMIT?` · mostrando los primeros ${LIMIT}`:''}</div>
  </div>
  <div class="table-wrap exp-wrap"><table class="exp">
  <thead><tr><th>Fecha</th><th>Descripción <span style="font-weight:400">· cat. Splitwise</span></th><th>Categoría</th><th>Origen</th><th class="num">Monto</th>${S.people.map(p=>`<th class="num">${esc(p.name)}</th>`).join('')}<th></th></tr></thead>
  <tbody>${list.slice(0,LIMIT).map(e => `<tr style="${e.excluded?'opacity:.5':''}">
    <td class="c-date">${e.date}</td>
    <td class="desc c-desc">${esc(e.desc)} ${e.issue?'<span class="tag warn">sin asignar</span>':''}${e.manual?' <span class="tag">manual</span>':''}${e.cat?`<span class="orig">${esc(e.cat)}</span>`:''}</td>
    <td class="c-cat"><select data-id="${esc(e.id)}" class="simpSel">${S.simpCats.map(c=>`<option ${e.simp===c?'selected':''}>${esc(c)}</option>`).join('')}</select>${S.overrides[e.id]?.simp?' <span class="tag" title="Categoría cambiada a mano">✎</span>':''}</td>
    <td class="muted c-orig">${esc(e.origin)}</td>
    <td class="num c-amt">${e.cur==='EUR'?eur(e.cost):`${e.cost.toLocaleString('es-ES')} ${esc(e.cur)} <span class="muted small">(${eur(e.costEUR)})</span>`}</td>
    ${S.people.map(p=>`<td class="num c-sh" data-label="${esc(p.name)}">${eur0(e.sharesEUR[p.id])}${S.overrides[e.id]?.shares?' ✎':''}</td>`).join('')}
    <td class="c-edit"><button class="icon" data-edit="${esc(e.id)}" title="Editar">✎</button></td>
  </tr>`).join('')}</tbody></table></div></div>`;
  const bind = (id, key, ev='onchange', val = el => el.value) => { $(id)[ev] = e => { F[key] = val(e.target); render(); }; };
  bind('#fMonth','month'); bind('#fOrigin','origin'); bind('#fSimp','simp'); bind('#fPerson','person');
  bind('#fExcl','showExcluded','onchange', el=>el.checked); bind('#fIssues','onlyIssues','onchange', el=>el.checked);
  let qt; $('#fQ').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value; render(); const i=$('#fQ'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }, 250); };
  $('#clearF') && ($('#clearF').onclick = () => { Object.assign(F, { month:'', origin:'', simp:'', q:'', person:'', onlyIssues:false, showExcluded:false }); render(); });
  $('#seeIssues') && ($('#seeIssues').onclick = ev => { ev.preventDefault(); Object.assign(F, { month:'', origin:'', simp:'', q:'', person:'', onlyIssues:true }); render(); });
  $('#addManual').onclick = () => editExpense(null);
  main.querySelectorAll('.simpSel').forEach(sel => sel.onchange = () => {
    const e = S.expenses.find(x => x.id === sel.dataset.id);
    const ov = { ...(S.overrides[e.id] || {}) };
    delete ov.simp;
    const auto = enrich({ ...e, id: '__tmp' }).simp;
    if (sel.value !== auto) ov.simp = sel.value;
    setOverride(e.id, ov); save(); render();
  });
  main.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editExpense(b.dataset.edit));
}
function setOverride(id, ov){ if (Object.keys(ov).length) S.overrides[id] = ov; else delete S.overrides[id]; }

function editExpense(id){
  const isNew = !id;
  const e = isNew ? { id: 'manual-' + Date.now(), origin: 'Manual', manual: true, date: new Date().toISOString().slice(0,10), desc:'', cat:'', cost:0, cur:'EUR', raw:{}, shares:{} } : S.expenses.find(x => x.id === id);
  const en = enrich(e);
  const ov = S.overrides[e.id] || {};
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog">
    <h3>${isNew ? 'Nuevo gasto manual' : 'Editar gasto'}</h3>
    ${isNew || e.manual ? `
      <div class="field"><label>Fecha</label><input type="date" name="date" value="${e.date}" required></div>
      <div class="field"><label>Descripción</label><input name="desc" value="${esc(e.desc)}" required></div>
      <div class="field"><label>Monto total</label><input type="number" step="0.01" name="cost" value="${e.cost||''}" required></div>

    ${!isNew && !e.manual ? `<p class="small muted">Calculado desde Splitwise: ${S.people.map(p=>`${esc(p.name)} ${e.shares[p.id]??0}`).join(' · ')}</p>
      <label class="small"><input type="checkbox" name="excluded" ${ov.excluded?'checked':''}> Excluir este gasto de los totales</label>` : ''}
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      ${!isNew && (e.manual || S.overrides[e.id]) ? `<button class="btn danger" value="reset" formnovalidate>${e.manual?'Borrar gasto':'Volver a lo de Splitwise'}</button>`:''}
      <button class="btn sec" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn" value="ok">Guardar</button>
    </div></form>`;
  dlg.showModal();
  whenClosed(dlg, act => {
    const f = dlg.querySelector('form');
    if (act === 'reset'){
      if (e.manual){ if (!confirm('¿Borrar este gasto manual?')) return; S.expenses = S.expenses.filter(x => x.id !== e.id); }
      delete S.overrides[e.id]; save(); render(); return;
    }
    if (act !== 'ok') return;
    const fd = new FormData(f);
    const shares = Object.fromEntries(S.people.map(p => [p.id, parseFloat(fd.get('sh_'+p.id)) || 0]));
    if (isNew || e.manual){
      Object.assign(e, { date: fd.get('date'), desc: fd.get('desc'), cost: parseFloat(fd.get('cost'))||0, cur: fd.get('cur'), shares, cat: '' });
      if (isNew) S.expenses.push(e);
      const o = {}; o.simp = fd.get('simp'); setOverride(e.id, o);
    } else {
      const o = {};
      if (fd.get('simp') !== enrich({ ...e, id:'__tmp' }).simp) o.simp = fd.get('simp');
      if (S.people.some(p => r2(shares[p.id]) !== r2(e.shares[p.id] || 0))) o.shares = shares;
      if (fd.get('excluded')) o.excluded = true;
      setOverride(e.id, o);
    }
    save(); render();
  });
}

/* Llama a fn(valorDelBoton) una sola vez cuando se cierra el diálogo.
   Escucha el submit del form (no solo "close", que algunos navegadores no disparan). */
function whenClosed(dlg, fn){
  let done = false;
  const finish = v => { if (done) return; done = true; setTimeout(() => fn(v), 0); };
  const form = dlg.querySelector('form');
  form.addEventListener('submit', ev => finish(ev.submitter?.value || 'ok'));
  dlg.oncancel = () => finish('cancel');
  dlg.onclose = () => finish(dlg.returnValue || 'cancel');
}

async function importFiles(files){
  const entries = [];
  for (const file of files){
    try {
      const text = await file.text(), entry = { name: file.name, parsed: parseSplitwise(text), mod: file.lastModified };
      // versión online: el CSV también se guarda en la carpeta data de Google Drive (así queda igual que si lo tirabas en la carpeta)
      if (dirHandle?.cloud && dirOk){
        try { const fh = await dirHandle.getFileHandle(file.name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close();
              entry.mod = (await fh.getFile()).lastModified; }
        catch(e){ toast(`${file.name}: no se pudo guardar en Google Drive (${e.message}); se importa igual`); }
      }
      entries.push(entry);
    }
    catch(err){ console.error(err); toast(`${file.name}: ${err.message}`); }
  }
  await importEntries(entries, { askOlder: true });
}

// entries: [{ name, parsed, mod }]. Devuelve cuántos grupos se actualizaron.
async function importEntries(entries, { askOlder = false } = {}){
  const results = [];
  for (const { name, parsed, mod } of entries){
    try {
      const prefix = prefixFromFilename(name);
      let g = groupForPrefix(prefix);
      if (!g){ g = await askGroup(name, prefix, parsed); if (!g){ S.seenFiles[name] = mod; continue; } }
      const unknown = parsed.memberCols.filter(m => !m.person).map(m => m.name);
      const known = parsed.memberCols.filter(m => m.person);
      if (!known.length){ toast(`${name}: no reconocí a ninguna persona (${unknown.join(', ')}). Agregá el alias en Configuración.`); continue; }
      const res = applyImport(g, parsed, name, askOlder);
      S.seenFiles[name] = mod;
      if (res && (res.added || res.removed || askOlder || S.imports[g.origin]?.file !== name))
        results.push(`${g.origin}: ${res.total} gastos (${res.added} nuevos, ${res.removed} quitados) · ${name}` + (unknown.length ? ` · ignorados: ${unknown.join(', ')}` : ''));
      if (res) S.imports[g.origin] = { file: name, at: Date.now(), count: res.total, maxDate: res.maxDate };
    } catch(err){ console.error(err); toast(`${name}: ${err.message}`); }
  }
  save(); render();
  if (results.length) showResult(results);
  return results.length;
}

function applyImport(g, parsed, filename, askOlder){
  const old = S.expenses.filter(e => e.origin === g.origin);
  const oldMax = old.reduce((a,e) => e.date > a ? e.date : a, '');
  const newMax = parsed.rows.reduce((a,e) => e.date > a ? e.date : a, '');
  if (oldMax && newMax < oldMax){
    // desde la carpeta no se pisa con un archivo más viejo; a mano, se pregunta
    if (!askOlder || !confirm(`El archivo ${filename} llega hasta ${newMax}, pero ya tenés gastos de "${g.origin}" hasta ${oldMax}. ¿Reemplazar igual?`)) return null;
  }
  const newRows = parsed.rows.map(r => ({ id: `${g.origin}|${r.key}`, origin: g.origin, date: r.date, desc: r.desc, cat: r.cat, cost: r.cost, cur: r.cur, raw: r.raw, shares: r.shares }));
  const oldIds = new Set(old.map(e => e.id)), newIds = new Set(newRows.map(e => e.id));
  S.expenses = S.expenses.filter(e => e.origin !== g.origin).concat(newRows);
  return { maxDate: newMax, total: newRows.length, added: newRows.filter(e => !oldIds.has(e.id)).length, removed: old.filter(e => !newIds.has(e.id)).length };
}

function showResult(lines){
  const dlg = $('#dlg');

// sugiere un grupo existente si los nombres comparten casi todas las palabras ("lucas-in-paris" ~ "lucas-maca-in-paris")
function similarGroup(prefix){
  const w = new Set(prefix.split(/[-_\s]+/).filter(x => x.length > 2));
  if (!w.size) return null;
  let best = null, bestScore = 0;
  for (const g of S.groups) for (const p of [g.prefix, ...(g.aliases || [])]){
    const v = new Set(p.split(/[-_\s]+/).filter(x => x.length > 2));
    const common = [...w].filter(x => v.has(x)).length, score = common / Math.min(w.size, v.size || 1);
    if (common && score > bestScore){ bestScore = score; best = g; }
  }
  return bestScore >= 0.99 ? best : null;
}

function askGroup(filename, prefix, parsed){
  return new Promise(resolve => {
    const pretty = prefix.replace(/[-_]+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    const dates = parsed.rows.map(r=>r.date).sort();
    const dlg = $('#dlg');
    dlg.innerHTML = `<form method="dialog"><h3>Grupo nuevo</h3>
      <p class="muted small">${esc(filename)} · ${parsed.rows.length} gastos${dates.length?` · ${dates[0]} a ${dates[dates.length-1]}`:''}<br>
      Miembros: ${parsed.memberCols.map(m => m.person ? `<b>${esc(m.name)}</b>` : esc(m.name)).join(', ')}</p>
      <div class="field"><label>¿Es un grupo que ya tenés con otro nombre? (por ejemplo, si lo renombraron en Splitwise)</label>
        <select name="same"><option value="">No, es un grupo nuevo</option>
        ${S.groups.slice().sort((a, b) => a.origin.localeCompare(b.origin)).map(g => `<option value="${esc(g.origin)}" ${similarGroup(prefix) === g ? 'selected' : ''}>Sí, es ${esc(g.origin)}</option>`).join('')}</select></div>
      <div id="newFields">
      <div class="field"><label>¿Es un viaje? (todo va a la categoría Viajes)</label>
        <select name="trip"><option value="1">Sí, es un viaje</option><option value="0">No, gastos normales</option></select></div>
      <div class="field"><label>Nombre del origen</label><input name="origin" value="Viaje - ${esc(pretty)}"></div>
      </div>
      <div class="row" style="justify-content:flex-end"><button class="btn sec" value="cancel" formnovalidate>Saltear</button><button class="btn" value="ok">Importar</button></div></form>`;
    const sel = dlg.querySelector('[name=trip]'), inp = dlg.querySelector('[name=origin]'), same = dlg.querySelector('[name=same]');
    sel.onchange = () => { inp.value = sel.value === '1' ? `Viaje - ${pretty}` : pretty; };
    const toggle = () => { $('#newFields').style.display = same.value ? 'none' : ''; };
    same.onchange = toggle; toggle();
    whenClosed(dlg, v => {
      if (v !== 'ok') return resolve(null);
      if (same.value){   // mismo grupo: se suma el prefijo como alias y se importa ahí
        const g = groupOf(same.value);
        g.aliases = [...new Set([...(g.aliases || []), prefix])];
        return resolve(g);
      }
      if (!inp.value.trim()) inp.value = pretty;
      const g = { prefix, origin: inp.value.trim(), trip: sel.value === '1' };
      S.groups = S.groups.filter(x => x.origin !== g.origin || x.prefix === prefix);
      S.groups.push(g); resolve(g);
    });
    dlg.showModal();
  });
}

async function gapi(url, { method = 'GET', headers = {}, body, raw = false } = {}){

async function gList(q){
  const out = []; let tok = '';

function cloudDir(f){
  const fileH = (name, item) => ({ kind: 'file', name,
    async getFile(){
      return { name, size: +(item?.size || 0), lastModified: item ? Date.parse(item.modifiedTime) : 0,
        text: async () => item ? (await gapi(`/files/${item.id}?alt=media&supportsAllDrives=true`, { raw: true })).text() : '' };
    },
    async createWritable(){
      let buf = '';
      return { write: async t => { buf += t; }, close: async () => {
        const type = /\.json$/i.test(name) ? 'application/json' : 'text/csv';
        if (item){
          // si alguien lo cambió desde que se leyó, no se pisa: se avisa para volver a leer y combinar
          const now = await gapi(`/files/${item.id}?fields=version&supportsAllDrives=true`);
          if (String(now.version) !== String(item.version)) throw Object.assign(new Error('El archivo cambió en el medio'), { conflict: true });
          item = await gapi(`${GUPLOAD}/files/${item.id}?uploadType=media&fields=${G_FIELDS}&supportsAllDrives=true`, { method: 'PATCH', headers: { 'Content-Type': type }, body: buf });
        } else {
          const b = 'finanzas' + Math.random().toString(36).slice(2);
          const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents: [f.id], mimeType: type })}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n${buf}\r\n--${b}--`;
          item = await gapi(`${GUPLOAD}/files?uploadType=multipart&fields=${G_FIELDS}&supportsAllDrives=true`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
        }
      } };
    } });
  const inFolder = `${gq(f.id)} in parents and trashed = false`;
  return { kind: 'directory', name: f.name, cloud: true, folder: f,
    async queryPermission(){ return cloudValid() ? 'granted' : 'prompt'; },
    async requestPermission(){ cloudLogin(false); return 'prompt'; },
    async getFileHandle(name, { create = false } = {}){
      const fs = (await gList(`${inFolder} and name = ${gq(name)}`)).sort((a, b) => b.modifiedTime.localeCompare(a.modifiedTime));
      if (fs[0]) return fileH(name, fs[0]);
      if (create) return fileH(name, null);
      throw Object.assign(new Error('No existe ' + name), { name: 'NotFoundError' });
    },
    async *entries(){
      for (const it of await gList(inFolder))

}

    else (byOrigin[e.origin] ??= []).push(e);
  }
  for (const [o, list] of Object.entries(byOrigin)) put('expG', o, list);
  (s.groups || []).forEach(g => put('groups', g.origin, g));
  for (const sec of ['overrides', 'catMap', 'beca', 'imports', 'seenFiles', 'trips', 'tripCities', 'tripColors', 'rates', 'reviewIgnored', 'plans'])
    for (const [k, v] of Object.entries(s[sec] || {})) put(sec, k, v);
  for (const [p, cats] of Object.entries(s.budgets || {})) for (const [c, v] of Object.entries(cats || {})) put('budgets', p + '\u0002' + c, v);
  for (const k of ['people', 'simpCats', 'excludedCats', 'puchoPrecio', 'ignoredDups']) put('misc', k, s[k]);
  return u;
}
function fromUnits(u, orderFrom){
  const s = DEFAULT_STATE();
  for (const k of ['overrides', 'catMap', 'beca', 'imports', 'seenFiles', 'trips', 'tripCities', 'tripColors', 'rates', 'reviewIgnored', 'plans', 'budgets']) s[k] = {};
  s.expenses = []; const groups = [];
  for (const [key, json] of Object.entries(u)){
    const [sec, k] = key.split('\u0001'), v = JSON.parse(json);
    if (sec === 'expM') s.expenses.push(v);
    else if (sec === 'expG') s.expenses.push(...v);
    else if (sec === 'groups') groups.push(v);
    else if (sec === 'budgets'){ const [p, c] = k.split('\u0002'); (s.budgets[p] ??= {})[c] = v; }
    else if (sec === 'misc') s[k] = v;
    else s[sec][k] = v;
  }
  const order = (orderFrom.groups || []).map(g => g.origin);
  s.groups = groups.sort((a, b) => ((order.indexOf(a.origin) + 1) || 1e9) - ((order.indexOf(b.origin) + 1) || 1e9));
  return s;
}
function threeWay(base, local, remote){
  const B = toUnits(base), Lo = toUnits(local), R = toUnits(remote), out = {};
  let fromRemote = 0;
  for (const k of new Set([...Object.keys(B), ...Object.keys(Lo), ...Object.keys(R)])){
    const b = B[k], l = Lo[k], r = R[k];
    let v;
    if (l === r) v = l;
    else if (l === b){ v = r; fromRemote++; }     // solo cambió en el archivo (la otra compu)
    else v = l;                                    // cambió acá (o en los dos: gana acá)
    if (v !== undefined) out[k] = v;
  }
  return { state: fromUnits(out, local), fromRemote };
}
const sameData = (a, b) => { const A = toUnits(a), B = toUnits(b); const ka = Object.keys(A); return ka.length === Object.keys(B).length && ka.every(k => A[k] === B[k]); };
function loadBase(){ try { const r = localStorage.getItem(BASE_KEY); return r ? migrate(JSON.parse(r)) : null; } catch(e){ return null; } }
function storeBase(s){ try { localStorage.setItem(BASE_KEY, JSON.stringify(s)); } catch(e){ console.warn('sin lugar para la base de sincronización', e); } }

async function syncData(){
  if (!dirHandle || !dirOk) return;
  if (dataSyncing){ dataSyncAgain = true; return dataSyncing; }
  dataSyncing = (async () => {
    try {
      const fh = await dirHandle.getFileHandle(DATA_FILE, { create: true });
      const file = await fh.getFile(), text = await file.text();
      const remote = text.trim() ? migrate(JSON.parse(text)) : null;
      let merged = S, fromRemote = 0;
      if (!tabActive) return;   // pestaña pausada: otra pestaña tiene la app abierta
      // el archivo es más viejo que lo último que sincronizó esta pestaña (p. ej. OneDrive trajo una versión anterior): no se toma
      const stale = remote && syncBase && (remote.savedAt || 0) < (syncBase.savedAt || 0);
      if (remote && !stale){
        const base = syncBase;
        if (base){ ({ state: merged, fromRemote } = threeWay(base, S, remote)); }
        else if ((remote.savedAt || 0) >= (S.savedAt || 0)){ merged = remote; fromRemote = 1; }   // primera vez en este navegador
        // primera vez en un navegador sin gastos (p. ej. recién entrado a la versión online): lo único propio de acá son los cambios hechos sobre lo vacío
        else if (!S.expenses.length){ ({ state: merged, fromRemote } = threeWay(DEFAULT_STATE(), S, remote)); }
        else {
          // primera vez y la copia del navegador es más nueva: se respetan los grupos que el archivo ya unió
          merged = S;
          for (const fg of remote.groups) for (const a of fg.aliases || []){
            const lg = S.groups.find(g => g.prefix === a && g.origin !== fg.origin);
            if (lg && groupOf(fg.origin)) mergeGroups(lg.origin, fg.origin);
          }
        }
      }
      const changedHere = merged !== S && !sameData(merged, S);
      // solo se reemplazan los datos en memoria si llegó algo de la otra compu (así no se pierden ediciones en curso)
      if (changedHere) S = merged;
      S.savedAt = Math.max(S.savedAt || 0, remote?.savedAt || 0);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e){}
      if (!remote || !sameData(S, remote)){
        const w = await fh.createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close();
      }
      // la base queda en la memoria de ESTA pestaña (una copia, no una referencia): otra pestaña no la puede cambiar
      syncBase = JSON.parse(JSON.stringify(S));
      storeBase(S);
      lastFileMod = (await fh.getFile()).lastModified; lastSync = Date.now();
      if (changedHere && fromRemote){ renderWhenIdle(); toast('Se incorporaron cambios guardados desde otra compu'); }
    } catch(e){
      // Google Drive avisó que el archivo cambió en el medio: se vuelve a leer y combinar
      if (e.conflict && (dataConflicts = (dataConflicts || 0) + 1) <= 3) dataSyncAgain = true;
      else if (e.login) dirOk = false;
      else { console.error(e); toast('No se pudo sincronizar con la carpeta: ' + e.message); }
    }
  })();
  await dataSyncing; dataSyncing = null;
  if (!dataSyncAgain) dataConflicts = 0;
  renderFileStatus();
  if (dataSyncAgain){ dataSyncAgain = false; await syncData(); }
}
const loadDataFile = syncData, writeDataFile = syncData;
// si el archivo cambió (OneDrive trajo cambios de la otra compu), se sincroniza al volver a la pestaña o cada 30 s
async function checkRemote(){
  if (!dirHandle || !dirOk || dataSyncing || document.hidden) return;
  try { const f = await (await dirHandle.getFileHandle(DATA_FILE)).getFile(); if (f.lastModified !== lastFileMod) await syncData(); } catch(e){}
}
setInterval(checkRemote, 30000);
window.addEventListener('focus', checkRemote);
document.addEventListener('visibilitychange', checkRemote);
setInterval(() => renderFileStatus(), 60000);

/* Lee los CSV de la carpeta (sin subcarpetas). Por cada grupo se queda con el
   archivo más completo (el que llega a la fecha más reciente; a igualdad, el más nuevo).
   force=false: saltea archivos que ya se procesaron sin cambios. */
async function syncFolder(force){
  if (!dirHandle || !dirOk || syncing) return;
  syncing = true; renderFileStatus();
  try {
    const best = {};
    for await (const [name, h] of dirHandle.entries()){
      if (h.kind !== 'file' || !/\.csv$/i.test(name)) continue;
      const file = await h.getFile();
      let parsed, text;
      // en Google Drive cada CSV se descarga una sola vez: después se usa la copia guardada en el navegador mientras no cambie
      const ck = dirHandle.cloud ? `csv|${name}|${file.lastModified}` : '';
      if (ck) text = await idb.get(ck).catch(() => null);
      if (text == null){ text = await file.text(); if (ck) idb.set(ck, text); }
      try { parsed = parseSplitwise(text); } catch(e){ console.warn(name, e); continue; }
      const maxDate = parsed.rows.reduce((a, r) => r.date > a ? r.date : a, '');
      // se agrupa por grupo (no por nombre de archivo): un grupo renombrado en Splitwise tiene varios prefijos
      const prefix = prefixFromFilename(name), key = groupForPrefix(prefix)?.origin || prefix;
      const cur = best[key], stamp = name.match(/_(\d{4}-\d{2}-\d{2})_export/)?.[1] || '';
      // gana el que llega más lejos; a igualdad, el exportado más tarde (fecha del nombre) y después el modificado más tarde
      if (!cur || maxDate > cur.maxDate || (maxDate === cur.maxDate && (stamp > cur.stamp || (stamp === cur.stamp && file.lastModified > cur.mod))))
        best[key] = { name, parsed, mod: file.lastModified, maxDate, stamp };
    }
    const todo = Object.values(best).filter(b => force || S.seenFiles[b.name] !== b.mod);
    const n = await importEntries(todo);
    if (!n && force) toast(Object.keys(best).length ? 'La carpeta no tiene novedades' : 'No hay CSV en la carpeta');
  } catch(e){ if (e.login) dirOk = false; else { console.error(e); toast('Error leyendo la carpeta: ' + e.message); } }
  syncing = false; renderFileStatus();
}

function renderFileStatus(){
  const el = $('#fileStatus');
  if (!canFolder){ el.innerHTML = '<span title="Usá Chrome o Edge para leer la carpeta data">Guardado en este navegador</span>'; return; }
  if (dirHandle && dirOk){
    const ago = !lastSync ? '' : Date.now() - lastSync < 60000 ? 'recién' : `hace ${Math.round((Date.now() - lastSync) / 60000)} min`;
    el.innerHTML = `${ONLINE ? '☁️' : '📁'} <span title="Lee los CSV y guarda ${DATA_FILE} en esta carpeta${ONLINE ? ' de Google Drive' + (cloudUser ? ' (' + esc(cloudUser) + ')' : '') : ''}">${esc(dirHandle.name)}${ago ? ` · <span class="muted">sincronizado ${ago}</span>` : ''}</span>
      <button class="btn sec" id="syncBtn" ${syncing || dataSyncing ? 'disabled' : ''}>${syncing || dataSyncing ? 'Leyendo…' : '↻ Sincronizar'}</button>`;
    $('#syncBtn').onclick = async () => { await syncData(); await syncFolder(true); };
  } else if (dirHandle){
    el.innerHTML = `<button class="btn" id="reconnect">${ONLINE ? '🔑 Entrar con Google' : '📁 Abrir carpeta ' + esc(dirHandle.name)}</button>`;
    $('#reconnect').onclick = reconnectFolder;
  } else {
    el.innerHTML = `<button class="btn" id="connect">${ONLINE && !cloudValid() ? '🔑 Entrar con Google' : '📁 Conectar carpeta data'}</button>`;
    $('#connect').onclick = connectFolder;
  }
}

(async () => {
  if (ONLINE){ try { await cloudStart(); } catch(e){ console.error(e); toast('Google Drive: ' + e.message); render(); } return; }
  try {
    dirHandle = await idb.get('dir');
    if (dirHandle && await dirHandle.queryPermission({ mode: 'readwrite' }) === 'granted'){ dirOk = true; await loadDataFile(); render(); await syncFolder(false); }
  } catch(e){ dirHandle = null; }
  render();
})();
render();
</script>
