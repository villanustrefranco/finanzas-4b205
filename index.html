/* Mapa base. Los servidores de OpenStreetMap bloquean (403) las páginas abiertas como archivo local,
   porque no mandan "Referer"; por eso se usa Esri y, si sus imágenes fallan, OpenStreetMap como respaldo.
   (CARTO no sirve: sin clave devuelve imágenes con la leyenda "API KEY REQUIRED" que no cuentan como error.) */
const TILE_PROVIDERS = [
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 18, attribution: 'Mapa © Esri, HERE, Garmin, © colaboradores de OpenStreetMap' } },
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 18, attribution: '© OpenStreetMap' } },
];
let tileProvider = 0;
function addBaseTiles(L, map){
  const p = TILE_PROVIDERS[tileProvider];
  const dark = matchMedia('(prefers-color-scheme: dark)').matches && p.dark;
  const layer = L.tileLayer(dark ? p.dark : p.url, p.opts).addTo(map);
  let errors = 0, loaded = 0;
  layer.on('tileload', () => loaded++);
  layer.on('tileerror', () => {
    if (++errors >= 4 && loaded === 0 && tileProvider < TILE_PROVIDERS.length - 1){
      tileProvider++; map.removeLayer(layer); addBaseTiles(L, map);   // pasa al siguiente proveedor
    }
  });
}
async function drawTripMap(points){
  const el = $('#tripMap'); if (!el) return;
  let L; try { L = await loadLeaflet(); } catch(e){ el.innerHTML = '<p class="muted" style="padding:24px">No se pudo cargar el mapa (¿sin conexión a internet?).</p>'; return; }
  if (!document.body.contains(el)) return;
  if (tripMap){ tripMap.remove(); tripMap = null; }
  tripMap = L.map(el, { scrollWheelZoom: false, minZoom: 2, worldCopyJump: true, maxBounds: [[-85, -240], [85, 240]], maxBoundsViscosity: 1 });
  addBaseTiles(L, tripMap);
  /* Cada viaje es un recorrido: una línea que une sus ciudades en orden y un marcador chico por ciudad.
     El gasto va en la etiqueta (texto), no en el tamaño: así no se pisan. Las etiquetas aparecen al
     acercarse o al elegir un viaje; al pasar por una tarjeta, ese viaje se resalta y el resto se atenúa. */
  const focus = ui.trip.origin;
  const byTrip = {};
  for (const p of points) (byTrip[p.origin] ??= []).push(p);
  tripLayers = {};
  for (const [origin, pts] of Object.entries(byTrip)){
    const stops = tripOf(origin)?.stops || [];
    const when = p => stops.find(s => s.name === p.stop)?.from || p.from;
    pts.sort((a, b) => when(a).localeCompare(when(b)));
    const confirmed = pts[0].confirmed;
    const layers = [];
    if (pts.length > 1){
      const line = L.polyline(pts.map(p => [p.lat, p.lon]), { color: pts[0].color, weight: 2.5, opacity: .8,
        dashArray: confirmed ? null : '4 6', lineCap: 'round', className: 'trip-route' }).addTo(tripMap);
      layers.push(line);
    }
    pts.forEach((p, i) => {
      const icon = L.divIcon({ className: '', iconSize: [0, 0], html:
        `<div class="pin ${confirmed ? '' : 'prop'} ${p.selected ? 'sel' : ''}" data-origin="${esc(origin)}" data-total="${p.total}">
           <span class="dot" style="background:${p.color}">${pts.length > 1 ? i + 1 : ''}</span>
           <span class="lbl"><b>${esc(p.stop)}</b> ${eurShort(p.total)} €</span></div>` });
      const m = L.marker([p.lat, p.lon], { icon, riseOnHover: true }).addTo(tripMap);
      m.bindTooltip(`<b>${esc(p.stop)}</b> · ${esc(origin.replace(/^viaje\s*-\s*/i, ''))}<br>${fmtDay(p.from)} → ${fmtDay(p.to)} · ${p.n} gastos · <b>${eur(p.total)}</b>${confirmed ? '' : '<br><i>ubicación propuesta</i>'}`,
        { direction: 'top', offset: [0, -10] });
      m.on('click', () => tripPick(p.key));
      layers.push(m);
    });
    tripLayers[origin] = layers;
  }
  const box = el;
  // etiquetas: solo de cerca o con un viaje elegido, y sin pisarse (si chocan, se oculta la de menor gasto)
  const syncLabels = () => {
    box.classList.toggle('labels', !!focus || tripMap.getZoom() >= 6 || points.length <= 6);
    const pins = [...box.querySelectorAll('.pin')];
    pins.forEach(p => p.classList.remove('nolbl'));
    if (!box.classList.contains('labels')) return;
    const placed = [];
    pins.map(p => ({ p, v: +p.dataset.total || 0 })).sort((a, b) => b.v - a.v).forEach(({ p }) => {
      const r = p.querySelector('.lbl').getBoundingClientRect(), d = p.querySelector('.dot').getBoundingClientRect();
      const boxes = [r, d];
      if (placed.some(q => boxes.some(b => !(b.right < q.left || b.left > q.right || b.bottom < q.top || b.top > q.bottom)))) { p.classList.add('nolbl'); placed.push(d); }
      else placed.push(r, d);
    });
  };
  tripMap.on('zoomend moveend', syncLabels);
  // encuadre: los lugares confirmados (una propuesta equivocada en otro continente no aleja todo el mapa)
  const frame = points.some(p => p.confirmed) && !focus ? points.filter(p => p.confirmed) : points;
  if (frame.length) tripMap.fitBounds(L.latLngBounds(frame.map(p => [p.lat, p.lon])).pad(0.15), { maxZoom: 8 });
  else tripMap.setView([48.85, 2.35], 4);
  syncLabels();
  if (focus) highlightTrip(focus);
}
let tripLayers = {};
// resalta un viaje en el mapa (al pasar por su tarjeta) y atenúa el resto
function highlightTrip(origin){
  const box = $('#tripMap'); if (!box) return;
  const o = origin || ui.trip.origin || '';
  box.classList.toggle('hl', !!o);
  box.querySelectorAll('.pin').forEach(p => p.classList.toggle('on', p.dataset.origin === o));
  for (const [k, ls] of Object.entries(tripLayers)) ls.forEach(l => l.setStyle && l.setStyle({ opacity: !o || k === o ? .85 : .15 }));
}

/* ---------- detalle de un viaje ---------- */
function tripStats(t, P){
  const ex = t.ex.filter(e => partOf(e, P) > 0.005);
  const pre = ex.filter(e => e.date < t.from), post = ex.filter(e => e.date > t.to);
  const sum = l => l.reduce((a, e) => a + partOf(e, P), 0);
  const byCity = {};
  for (const e of ex){
    const s = stopFor(e.origin, e.date, e.desc), k = s?.name || 'Sin lugar';
    const c = byCity[k] ??= { name: k, total: 0, n: 0, days: s?.from && s?.to ? daysBetween(s.from, s.to) : 0 };
    c.total += partOf(e, P); c.n++;
  }
  const top = ex.slice().sort((a, b) => partOf(b, P) - partOf(a, P)).slice(0, 6);
  return { ex, pre: sum(pre), preN: pre.length, post: sum(post), inTrip: sum(ex) - sum(pre) - sum(post),
    cities: Object.values(byCity).sort((a, b) => b.total - a.total), top };
}

  </div>`;
}

let tripDayGeom = null;
function tripDayChart(t, P){
  const st = tripStats(t, P);
  if (!st.ex.length) return '<p class="muted">Sin gastos.</p>';
  // columnas: reservas previas (juntas) + cada día del viaje + lo pagado después
  const days = []; for (let d = t.from; d <= t.to; d = new Date(Date.parse(d) + 864e5).toISOString().slice(0, 10)) days.push(d);
  const cols = [...(st.pre > 0 ? [{ key: 'pre', label: 'Antes' }] : []), ...days.map(d => ({ key: d, label: String(+d.slice(8)) })), ...(st.post > 0 ? [{ key: 'post', label: 'Después' }] : [])];
  const colOf = d => d < t.from ? 'pre' : d > t.to ? 'post' : d;
  // rubros: los 5 más grandes + "otros"
  const topCats = t.byCat.slice(0, 5).map(([c]) => c);
  const rub = c => topCats.includes(catEs(c)) ? catEs(c) : 'Otros rubros';
  const cats = [...topCats, ...(t.byCat.length > 5 ? ['Otros rubros'] : [])];
  const colorOf = c => c === 'Otros rubros' ? 'var(--s-other)' : `var(--s${topCats.indexOf(c) + 1})`;
  const m = {}; for (const e of st.ex){ const k = colOf(e.date); (m[k] ??= {})[rub(e.cat)] = (m[k]?.[rub(e.cat)] || 0) + partOf(e, P); }
  const totals = cols.map(c => cats.reduce((a, k) => a + (m[c.key]?.[k] || 0), 0));
  const W = chartWidth(), H = 280, padL = 46, padR = 10, padT = 22, padB = 30;
  const { step, hi } = niceScale(0, Math.max(...totals, 1));
  const y = v => padT + (H - padT - padB) * (1 - v / hi);
  const slot = (W - padL - padR) / cols.length, bw = Math.min(34, slot * 0.7);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto día por día">`;
  for (let v = 0; v <= hi + 1e-9; v += step) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${eurShort(v)}</text>`;
  s += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const every = Math.ceil(cols.length / 31);
  cols.forEach((c, i) => {
    const x = padL + i * slot + (slot - bw) / 2; let acc = 0;
    const present = cats.filter(k => (m[c.key]?.[k] || 0) > 0);
    present.forEach((k, j) => {
      const v = m[c.key][k], y0 = y(acc), y1 = y(acc + v), top = j === present.length - 1;
      s += top ? `<path class="seg" d="${roundedBar(x, y1, bw, y0 - y1, 3)}" fill="${colorOf(k)}"/>`
               : `<rect class="seg" x="${x}" y="${y1 + ((y0 - y1) > 3 ? 1 : 0)}" width="${bw}" height="${Math.max(0, y0 - y1 - ((y0 - y1) > 3 ? 1 : 0))}" fill="${colorOf(k)}"/>`;
      acc += v;
    });
    if (c.key === 'pre' || c.key === 'post') s += `<rect x="${padL + i * slot}" y="${padT}" width="${slot}" height="${H - padT - padB}" fill="var(--text)" opacity=".03"/>`;
    const first = c.key.length === 10 && (c.key.endsWith('-01') || c.key === t.from);
    if (i % every === 0 || c.key.length !== 10) s += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" ${c.key.length !== 10 ? 'style="font-weight:600"' : ''}>${c.label}${first ? ' ' + MESES[+c.key.slice(5, 7) - 1] : ''}</text>`;
  });
  s += `<g id="tripDayHover"></g><rect id="tripDayHit" x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent"/></svg>`;
  tripDayGeom = { cols, m, cats, colorOf, totals, slot, padL, bw, padT, padB, H };
  setTimeout(() => { const lg = $('#tripDayLegend'); if (lg) lg.innerHTML = cats.map(c => `<span><i style="background:${colorOf(c)}"></i>${esc(c)}</span>`).join(''); });
  return s;
}
function bindTripDayChart(t, P){
  const svg = $('#tripDayChart svg'), hit = $('#tripDayHit'), layer = $('#tripDayHover'); if (!svg || !tripDayGeom) return;
  const G = tripDayGeom;
  let running = 0; const acc = G.totals.map(v => running += v);
  hit.addEventListener('pointermove', ev => {
    const p = svgPoint(svg, ev), i = Math.floor((p.x - G.padL) / G.slot), c = G.cols[i];
    if (!c){ layer.innerHTML = ''; hideTip(); return; }
    const x = G.padL + i * G.slot;
    layer.innerHTML = `<rect x="${x}" y="${G.padT - 16}" width="${G.slot}" height="${G.H - G.padB - G.padT + 16}" fill="var(--text)" opacity=".06" rx="3"/>`;
    const head = c.key === 'pre' ? 'Reservas pagadas antes del viaje' : c.key === 'post' ? 'Pagado después del viaje' : `${fmtDay(c.key)} · ${esc(stopFor(t.o, c.key)?.name || '')}`;
    const rows = G.cats.filter(k => G.m[c.key]?.[k]).map(k => `<tr><td><i style="background:${G.colorOf(k)}"></i>${esc(k)}</td><td style="text-align:right">${eur(G.m[c.key][k])}</td></tr>`).join('');
    showTip(`<div class="h">${head}</div><div class="sub">Total ${eur(G.totals[i])} · acumulado ${eur(acc[i])}</div>${rows ? `<table>${rows}</table>` : '<div class="muted">Sin gastos este día</div>'}`,
      ev, { left: screenX(svg, x), right: screenX(svg, x + G.slot) });
  });
  hit.addEventListener('pointerleave', ev => { if (ev.pointerType !== 'touch'){ layer.innerHTML = ''; hideTip(); } });
  onTapOutside(hit, () => { layer.innerHTML = ''; hideTip(); });
}

/* =========================================================
   Planificar viajes (etapa 1): planes, ítems con alternativas, división entre viajeros,
   estados, gastos diarios por ciudad con sugerencias, resumen y pendientes.
   ========================================================= */
const RUBROS = [
  { id: 'transporte', label: 'Transporte', icon: '✈️' },
  { id: 'alojamiento', label: 'Alojamiento', icon: '🛏️' },
  { id: 'actividad', label: 'Actividades', icon: '🎟️' },
  { id: 'otro', label: 'Otros', icon: '🧳' },
];
const ESTADOS = [
  { id: 'presupuestado', label: 'Presupuestado', cls: 'st-pres' },
  { id: 'reservado', label: 'Reservado', cls: 'st-res' },
  { id: 'pagado', label: 'Pagado', cls: 'st-pag' },
];
const DAILY = [
  { id: 'comida', label: 'Comida', help: 'súper, restaurantes, cafés', cats: ['Courses', 'Nourriture et boissons - Autre', 'Sorties'] },
  { id: 'salidas', label: 'Bebidas y salidas', help: 'bares, birras, música, cine', cats: ['Alcool', 'Musique', 'Cinéma', 'Divertissement - Autre'] },
  { id: 'transporte', label: 'Transporte local', help: 'metro, bus urbano, taxi', cats: ['Bus/train', 'Taxi'] },
];
const uid = () => Math.random().toString(36).slice(2, 10);
const planList = () => Object.values(S.plans || {}).sort((a, b) => (b.from || '').localeCompare(a.from || ''));
const nightsOf = c => c.from && c.to ? Math.max(0, daysBetween(c.from, c.to) - 1) : 0;
// días de cada ciudad para el presupuesto diario: las noches, y la última ciudad suma el día de vuelta
function cityDays(plan, pid = curProp(plan)){
  const cs = pCities(plan, pid).slice().sort((a, b) => (a.from || '').localeCompare(b.from || ''));
  return Object.fromEntries(cs.map((c, i) => [c.id, nightsOf(c) + (i === cs.length - 1 ? 1 : 0)]));
}
const nTrav = (plan, it) => it.split === 'all' || !Array.isArray(it.split) ? plan.travelers.length : Math.max(1, it.split.length);
const travIn = (plan, it, tid) => it.split === 'all' || !Array.isArray(it.split) || it.split.includes(tid);

/* costo de una opción: total del grupo y por persona */
function optCost(plan, it, o){
  const n = nTrav(plan, it), c = +o?.cost || 0;
  return (o?.costMode || it.costMode) === 'pp' ? { total: c * n, pp: c } : { total: c, pp: c / n };
}
/* costo del ítem: si hay elegida, esa; si no, rango entre la más barata y la más cara */
function itemCost(plan, it){
  const opts = (it.options || []).filter(o => o.cost !== '' && o.cost != null);
  const chosen = it.options?.find(o => o.id === it.chosen) || (it.options?.length === 1 ? it.options[0] : null);
  if (chosen && chosen.cost !== '' && chosen.cost != null){ const c = optCost(plan, it, chosen); return { min: c, max: c, chosen, priced: true }; }
  if (!opts.length) return { min: { total: 0, pp: 0 }, max: { total: 0, pp: 0 }, chosen: null, priced: false };
  const cs = opts.map(o => optCost(plan, it, o)).sort((a, b) => a.total - b.total);
  return { min: cs[0], max: cs[cs.length - 1], chosen: null, priced: true, undecided: opts.length > 1 };
}

/* ---------- sugerencias de gasto diario a partir de viajes anteriores ---------- */
const sugCache = new Map();
function dailySuggestions(country){
  const ck = S.expenses.length + '|' + Object.keys(S.trips).length + '|' + country;
  if (sugCache.has(ck)) return sugCache.get(ck);
  const res = dailySuggestionsRaw(country); sugCache.set(ck, res); return res;
}
function dailySuggestionsRaw(country){
  const byTrip = {};
  for (const e of tripExpenses()) (byTrip[e.origin] ??= []).push(e);
  const rows = [];
  for (const [o, ex] of Object.entries(byTrip)){
    const core = tripCore(ex); if (!core.from || core.days < 2) continue;
    const inCore = ex.filter(e => e.date >= core.from && e.date <= core.to);
    const ppl = S.people.filter(p => inCore.some(e => e.sharesEUR[p.id] > 0)).length; if (!ppl) continue;
    const per = {};
    for (const d of DAILY){
      const v = inCore.filter(e => d.cats.includes(e.cat) && (d.id !== 'transporte' || e.costEUR / Math.max(1, ppl) < 25))
        .reduce((a, e) => a + S.people.reduce((s, p) => s + e.sharesEUR[p.id], 0), 0);
      per[d.id] = v / (core.days * ppl);
    }
    const stops = S.trips[o]?.stops || [];
    rows.push({ o, days: core.days, per, sameCountry: !!country && stops.some(s => normTxt(s.full || '').includes(normTxt(country))) });
  }
  const pick = rows.some(r => r.sameCountry) ? rows.filter(r => r.sameCountry) : rows;
  const tot = pick.reduce((a, r) => a + r.days, 0) || 1;
  const out = Object.fromEntries(DAILY.map(d => [d.id, Math.round(pick.reduce((a, r) => a + r.per[d.id] * r.days, 0) / tot)]));
  return { ...out, basis: pick.length ? `${pick.length} viaje${pick.length > 1 ? 's' : ''}${pick[0]?.sameCountry ? ` en ${country}` : ''}` : 'sin datos' };
}
const countryOf = c => (c.full || '').split(',').pop().trim();
const dailyOf = (c, sug, k) => c.daily?.[k] ?? sug[k];

/* ---------- totales del plan ---------- */
function planTotals(plan, pid = curProp(plan)){
  const byRubro = {}, status = { presupuestado: 0, reservado: 0, pagado: 0 }, perTrav = Object.fromEntries(plan.travelers.map(t => [t.id, { min: 0, max: 0 }]));
  let min = 0, max = 0;
  for (const it of pItems(plan, pid)){
    const c = itemCost(plan, it);
    const r = byRubro[it.rubro] ??= { min: 0, max: 0, n: 0 }; r.min += c.min.total; r.max += c.max.total; r.n++;
    min += c.min.total; max += c.max.total;
    status[it.status || 'presupuestado'] += c.min.total;
    for (const t of plan.travelers) if (travIn(plan, it, t.id)){ perTrav[t.id].min += c.min.pp; perTrav[t.id].max += c.max.pp; }
  }
  // diarios: por persona y por día según la ciudad, para todos los viajeros
  const days = cityDays(plan, pid); let daily = 0; const dailyBy = {};
  for (const c of pCities(plan, pid)){
    const sug = dailySuggestions(countryOf(c));
    const pp = DAILY.reduce((a, d) => a + (+dailyOf(c, sug, d.id) || 0), 0) * (days[c.id] || 0);
    dailyBy[c.id] = pp; daily += pp;
  }
  const dTot = daily * plan.travelers.length;
  byRubro.diarios = { min: dTot, max: dTot, n: pCities(plan, pid).length };
  min += dTot; max += dTot; status.presupuestado += dTot;
  for (const t of plan.travelers){ perTrav[t.id].min += daily; perTrav[t.id].max += daily; }
  const n = plan.travelers.length || 1;
  return { min, max, ppMin: min / n, ppMax: max / n, byRubro, status, perTrav, dailyPP: daily, dailyBy };
}
function planPending(plan, pid = curProp(plan)){
  const out = [];
  for (const it of pItems(plan, pid)){
    const c = itemCost(plan, it), name = itemName(it);
    if (c.undecided) out.push({ it, txt: `Falta elegir entre ${it.options.length} opciones: ${name}` });
    else if (!c.priced) out.push({ it, txt: `Sin precio: ${name}` });
    else if ((it.status || 'presupuestado') === 'presupuestado') out.push({ it, txt: `Falta reservar: ${name}` });
    else if (it.status === 'reservado') out.push({ it, txt: `Reservado, falta pagar: ${name}`, soft: true });
  }
  for (const c of pCities(plan, pid)){
    if (nightsOf(c) > 0 && !pItems(plan, pid).some(it => it.rubro === 'alojamiento' && it.cityId === c.id))
      out.push({ txt: `Sin alojamiento en ${c.name} (${nightsOf(c)} noche${nightsOf(c) > 1 ? 's' : ''})`, cityId: c.id });
  }
  return out;
}
const itemName = it => it.rubro === 'transporte' && (it.fromPlace || it.toPlace) ? `${it.fromPlace || '?'} → ${it.toPlace || '?'}` : (it.title || '(sin nombre)');
const fmtRange = (a, b) => Math.abs(a - b) < 0.5 ? eur(a) : `${eur(a)} – ${eur(b)}`;

/* ---------- vista ---------- */

  if (!plan){ ui.plan.id = ''; return renderPlanList(main); }
  renderPlan(main, plan);
}

    </div>`; }).join('')}</div>`
  : `<div class="panel" style="text-align:center;padding:36px"><div style="font-size:32px">🗺️</div><h2>Todavía no hay planes</h2>

function statusBar(t){
  const tot = t.status.presupuestado + t.status.reservado + t.status.pagado || 1;
  return `<div class="stbar" title="Pagado ${eur(t.status.pagado)} · reservado ${eur(t.status.reservado)} · presupuestado ${eur(t.status.presupuestado)}">

    <div class="stleg small muted">${ESTADOS.slice().reverse().map(s => `<span><i class="${s.cls}"></i>${s.label} ${eur(t.status[s.id])}</span>`).join('')}</div>`;

/* ---------- Propuestas: versiones completas del viaje (itinerario, tramos y alojamientos distintos) ----------
   Cada ciudad e ítem tiene `props`: sin definir = está en todas las propuestas; una lista = solo en esas.
   Así lo común (el vuelo de ida, por ejemplo) se carga una vez y lo que cambia queda en cada propuesta. */
const hasProps = plan => (plan.proposals || []).length > 1;
function curProp(plan){
  if (!hasProps(plan)) return null;
  const ok = id => plan.proposals.some(p => p.id === id);
  if (plan.id === ui.plan.id && ok(ui.plan.prop)) return ui.plan.prop;
  return ok(plan.chosenProposal) ? plan.chosenProposal : plan.proposals[0].id;
}
const inProp = (x, pid) => !pid || !Array.isArray(x.props) || x.props.includes(pid);
const pCities = (plan, pid = curProp(plan)) => (plan.cities || []).filter(c => inProp(c, pid));
const pItems = (plan, pid = curProp(plan)) => (plan.items || []).filter(i => inProp(i, pid));
const propName = (plan, id) => plan.proposals?.find(p => p.id === id)?.name || '';
const propLetter = (plan, id) => String.fromCharCode(65 + Math.max(0, (plan.proposals || []).findIndex(p => p.id === id)));
// para ítems y ciudades nuevos: si hay propuestas, van a la que se está viendo
const defaultProps = plan => hasProps(plan) ? [curProp(plan)] : undefined;
function propDates(plan, pid){
  const cs = pCities(plan, pid).filter(c => c.from || c.to);
  const ds = cs.flatMap(c => [c.from, c.to]).filter(Boolean).sort();
  return ds.length ? { from: ds[0], to: ds[ds.length - 1], days: daysBetween(ds[0], ds[ds.length - 1]) } : null;
}
// rango del plan para la tarjeta: la propuesta elegida, o de la más barata a la más cara
function planRange(plan){
  if (!hasProps(plan)) { const t = planTotals(plan, null); return { min: t.ppMin, max: t.ppMax, t }; }
  if (plan.chosenProposal && plan.proposals.some(p => p.id === plan.chosenProposal)){ const t = planTotals(plan, plan.chosenProposal); return { min: t.ppMin, max: t.ppMax, t, chosen: true }; }
  const ts = plan.proposals.map(p => planTotals(plan, p.id));
  return { min: Math.min(...ts.map(t => t.ppMin)), max: Math.max(...ts.map(t => t.ppMax)), t: ts[0], n: ts.length };
}

function propBarHtml(plan){
  if (!hasProps(plan)) return `<div class="prop-bar"><span class="small muted">¿Dudan entre armar el viaje de distintas formas? Creá propuestas para compararlas enteras.</span>
    <button class="btn sec small-btn" id="propAdd">+ Propuesta</button></div>`;
  const cur = curProp(plan);
  return `<div class="prop-bar">${plan.proposals.map(p => { const t = planTotals(plan, p.id);
      return `<button class="prop-chip ${p.id === cur ? 'on' : ''}" data-prop="${p.id}">
        <b>${propLetter(plan, p.id)} · ${esc(p.name)}</b>${plan.chosenProposal === p.id ? ' <span class="status good">✓ elegida</span>' : ''}
        <span class="small muted">${fmtRange(t.ppMin, t.ppMax)} /p</span></button>`; }).join('')}
    <button class="btn sec small-btn" id="propAdd">+ Propuesta</button>

}
function bindPropBar(plan){
  $('#propAdd') && ($('#propAdd').onclick = () => proposalDialog(plan, null));

function proposalDialog(plan, prop){
  const isNew = !prop, dlg = $('#dlg');
  const first = !hasProps(plan);
  dlg.innerHTML = `<form method="dialog" style="width:min(460px,86vw)"><h3>${isNew ? 'Nueva propuesta' : 'Renombrar propuesta'}</h3>
    ${isNew && first ? '<p class="small muted">Lo que ya cargaron pasa a ser la <b>Propuesta A</b> (podés renombrarla después). Lo que esté en todas las propuestas (por ejemplo, el vuelo de ida) se carga una sola vez.</p>' : ''}

    ${isNew ? `<label class="check"><input type="checkbox" name="pcopy" checked> Empezar como copia de "${esc(first ? 'Propuesta A' : propName(plan, curProp(plan)))}" y cambiar lo que haga falta</label>` : ''}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">${isNew ? 'Crear' : 'Guardar'}</button></div></form>`;

function deleteProposal(plan, pid){
  const only = [...plan.items, ...plan.cities].filter(x => Array.isArray(x.props) && x.props.length === 1 && x.props[0] === pid).length;
  if (!confirm(`¿Borrar la propuesta "${propName(plan, pid)}"?${only ? `\n\nSe borran también ${only} ciudades o ítems que solo estaban en ella.` : ''}`)) return;
  plan.items = plan.items.filter(x => !(Array.isArray(x.props) && x.props.length === 1 && x.props[0] === pid));
  plan.cities = plan.cities.filter(x => !(Array.isArray(x.props) && x.props.length === 1 && x.props[0] === pid));
  for (const x of [...plan.items, ...plan.cities]) if (Array.isArray(x.props)) x.props = x.props.filter(id => id !== pid);
  plan.proposals = plan.proposals.filter(p => p.id !== pid);
  if (plan.chosenProposal === pid) plan.chosenProposal = null;
  if (plan.proposals.length <= 1){ for (const x of [...plan.items, ...plan.cities]) delete x.props; plan.proposals = []; plan.chosenProposal = null; }
  ui.plan.prop = ''; save(); render();
}

// comparación lado a lado de todas las propuestas
function propCompareHtml(plan){
  if (!hasProps(plan)) return '';
  const cur = curProp(plan);
  const rows = plan.proposals.map(p => ({ p, t: planTotals(plan, p.id), d: propDates(plan, p.id), cs: pCities(plan, p.id).slice().sort((a, b) => (a.from || '').localeCompare(b.from || '')), pend: planPending(plan, p.id).filter(x => !x.soft).length }));

    ${rows.map(r => `<tr class="${r.p.id === cur ? 'sel-row' : ''}"><td><b>${propLetter(plan, r.p.id)} · ${esc(r.p.name)}</b>${plan.chosenProposal === r.p.id ? ' <span class="status good">✓ elegida</span>' : ''}</td>
      <td class="desc small">${r.cs.map(c => `${esc(c.name)}${nightsOf(c) ? ` <span class="muted">(${nightsOf(c)})</span>` : ''}`).join(' → ') || '–'}</td>
      <td class="num">${r.d?.days || '–'}</td>${['transporte', 'alojamiento', 'actividad', 'diarios'].map(k => `<td class="num">${col(r, k)}</td>`).join('')}
      <td class="num"><b>${fmtRange(r.t.ppMin, r.t.ppMax)}</b>${Math.abs(r.t.ppMin - best) < 0.5 ? ' <span class="tag">la más barata</span>' : ''}</td>
      <td class="num">${r.pend || '✓'}</td><td>${r.p.id === cur ? '<span class="muted small">viendo</span>' : `<button class="btn sec small-btn" data-prop="${r.p.id}">Ver</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ---------- Mapa del plan: ciudades, tramos y alternativas de la propuesta que se está viendo ---------- */
const MODE_ICON = m => { const t = normTxt(m); return /avion|vuelo|fly/.test(t) ? '✈️' : /tren|train/.test(t) ? '🚆' : /bus|micro/.test(t) ? '🚌' : /auto|coche|car/.test(t) ? '🚗' : /barco|ferry/.test(t) ? '⛴️' : '➜'; };
const isFlight = m => /avion|vuelo|fly/.test(normTxt(m));
let planMap = null, planGeoBusy = new Set();
// coordenadas de un lugar: primero las ciudades del plan, después las que ya se buscaron, si no se busca
function placeCoord(plan, name){
  if (!name) return null;
  const n = normTxt(name);
  const c = plan.cities.find(c => c.lat != null && (normTxt(c.name) === n || normTxt(c.name).startsWith(n) || n.startsWith(normTxt(c.name))));
  if (c) return { lat: c.lat, lon: c.lon };
  const k = plan.places?.[n]; if (k) return k.lat != null ? k : null;
  if (!planGeoBusy.has(n) && !geoFailed){
    planGeoBusy.add(n);
    geocode(name, '&limit=1&featureType=settlement').then(rs => {
      (plan.places ??= {})[n] = rs[0] ? { lat: rs[0].lat, lon: rs[0].lon } : { lat: null };
      save(); if ($('#planMap')) drawPlanMap(plan, { refit: true });
    }).catch(() => {}).finally(() => planGeoBusy.delete(n));
  }
  return null;
}
// las etiquetas de los tramos no pisan las de las ciudades: si chocan, se ocultan (el tramo sigue teniendo su detalle al pasar el mouse)
function declutterPlanMap(el){
  // 1) ciudades: si dos etiquetas chocan, queda la primera del recorrido y la otra se ve al acercar o al pasar el mouse
  const cityPlaced = [];
  const hitR = (r, q) => !(r.right < q.left || r.left > q.right || r.bottom < q.top || r.top > q.bottom);
  el.querySelectorAll('.pin').forEach(p => {
    p.classList.remove('nolbl');
    const lbl = p.querySelector('.lbl'); if (!lbl) return;
    const r = lbl.getBoundingClientRect(), d = p.querySelector('.dot').getBoundingClientRect();
    if (cityPlaced.some(q => hitR(r, q) || hitR(d, q))){ p.classList.add('nolbl'); cityPlaced.push(d); } else cityPlaced.push(r, d);
  });
  // 2) tramos: se ocultan las etiquetas que tapan una ciudad o a otro tramo
  const boxes = [...el.querySelectorAll('.pin:not(.nolbl) .lbl, .pin .dot')].map(x => x.getBoundingClientRect());
  const placed = [];
  el.querySelectorAll('.leg-lbl').forEach(l => {
    l.style.visibility = '';
    const r = l.getBoundingClientRect();
    const hit = q => !(r.right < q.left || r.left > q.right || r.bottom < q.top || r.top > q.bottom);
    if (boxes.some(hit) || placed.some(hit)) l.style.visibility = 'hidden'; else placed.push(r);
  });
}
// curva suave para los vuelos (un arco entre dos puntos)
function arc(a, b){
  const pts = [], dx = b.lon - a.lon, dy = b.lat - a.lat, k = 0.18;
  const mx = (a.lon + b.lon) / 2 - dy * k, my = (a.lat + b.lat) / 2 + dx * k;
  for (let t = 0; t <= 1.0001; t += 0.05) pts.push([(1 - t) ** 2 * a.lat + 2 * (1 - t) * t * my + t * t * b.lat, (1 - t) ** 2 * a.lon + 2 * (1 - t) * t * mx + t * t * b.lon]);
  return pts;
}
function planLegs(plan, pid){
  return pItems(plan, pid).filter(i => i.rubro === 'transporte' && (i.fromPlace || i.toPlace)).sort((a, b) => itemSortKey(a).localeCompare(itemSortKey(b)))
    .map(it => ({ it, a: placeCoord(plan, it.fromPlace), b: placeCoord(plan, it.toPlace) }));
}
async function drawPlanMap(plan, { refit = false } = {}){
  const el = $('#planMap'); if (!el) return;
  let L; try { L = await loadLeaflet(); } catch(e){ el.innerHTML = '<p class="muted" style="padding:24px">No se pudo cargar el mapa (¿sin conexión a internet?).</p>'; return; }
  if (!document.body.contains(el)) return;
  const view = !refit && planMap && planMap._container === el ? { c: planMap.getCenter(), z: planMap.getZoom() } : null;
  if (planMap){ planMap.remove(); planMap = null; }
  planMap = L.map(el, { scrollWheelZoom: false, minZoom: 2 });
  addBaseTiles(L, planMap);
  const cur = curProp(plan), showOthers = hasProps(plan) && ui.plan.mapOthers !== false;
  const bounds = [];
  const drawProp = (pid, main) => {
    const color = main ? plan.color : '#898781', op = main ? .9 : .45;
    // tramos
    for (const { it, a, b } of planLegs(plan, pid)){
      if (!a || !b) continue;
      const opts = it.options || [], ch = chosenOpt(it), modes = [...new Set(opts.map(o => o.mode || it.mode).filter(Boolean))];
      const mode = ch?.mode || it.mode || modes[0] || '', undecided = !ch && opts.length > 1;
      const path = isFlight(mode) && !undecided ? arc(a, b) : [[a.lat, a.lon], [b.lat, b.lon]];
      const line = L.polyline(path, { color, weight: main ? 3 : 2, opacity: op, dashArray: undecided ? '2 7' : isFlight(mode) ? '8 6' : null, lineCap: 'round' }).addTo(planMap);
      path.forEach(p => bounds.push(p));
      if (!main) continue;
      const c = itemCost(plan, it);
      // punto medio del tramo (en la línea recta, el promedio de los extremos; en el arco, el punto del medio)
      const mid = path.length === 2 ? [(path[0][0] + path[1][0]) / 2, (path[0][1] + path[1][1]) / 2] : path[Math.floor(path.length / 2)];
      const icon = undecided ? modes.map(MODE_ICON).join('') || '❔' : MODE_ICON(mode);
      const lbl = L.marker(mid, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="leg-lbl ${undecided ? 'undec' : ''}">${icon} ${c.priced ? (undecided ? `${eurShort(c.min.pp)}–${eurShort(c.max.pp)}` : eurShort(c.min.pp)) + ' €' : ''}</div>` }) }).addTo(planMap);
      const tip = `<b>${esc(itemName(it))}</b>${undecided ? ` · <i>${opts.length} alternativas sin elegir</i>` : ''}<br>` +
        (opts.length > 1 || !ch ? opts : [ch]).map(o => `${MODE_ICON(o.mode || it.mode)} ${esc(o.label || 'opción')}${optWhen(it, o) ? ' · ' + esc(optWhen(it, o)) : ''}${o.cost !== '' && o.cost != null ? ' · <b>' + eur(optCost(plan, it, o).pp) + '/p</b>' : ''}${ch && o.id === ch.id && opts.length > 1 ? ' ✓' : ''}`).join('<br>');
      line.bindTooltip(tip, { sticky: true }); lbl.bindTooltip(tip, { direction: 'top' });
      const open = () => editItemDialog(plan, it); line.on('click', open); lbl.on('click', open);
    }
    // ciudades
    const cs = pCities(plan, pid).filter(c => c.lat != null).sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    const legsExist = planLegs(plan, pid).some(l => l.a && l.b);
    if (!legsExist && cs.length > 1) L.polyline(cs.map(c => [c.lat, c.lon]), { color, weight: 2, opacity: op * .7, dashArray: '4 6' }).addTo(planMap);
    cs.forEach((c, i) => {
      bounds.push([c.lat, c.lon]);
      if (!main){ L.circleMarker([c.lat, c.lon], { radius: 5, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: .6 }).addTo(planMap)
        .bindTooltip(`${esc(c.name)} · propuesta ${propLetter(plan, pid)}`); return; }
      const lodg = pItems(plan, pid).filter(x => x.rubro === 'alojamiento' && x.cityId === c.id);
      const lodgTxt = lodg.length ? lodg.map(x => { const ch = chosenOpt(x); return ch ? `🛏️ ${esc(ch.label || x.title)}` : `🛏️ ${x.options.length} opciones sin elegir`; }).join('<br>') : (nightsOf(c) ? '🛏️ <i>sin alojamiento</i>' : '');
      const m = L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', iconSize: [0, 0], html:
        `<div class="pin"><span class="dot" style="background:${color}">${i + 1}</span><span class="lbl"><b>${esc(c.name)}</b> ${nightsOf(c) ? nightsOf(c) + ' n' : ''}</span></div>` }) }).addTo(planMap);
      // clic en la ciudad: abre su alojamiento (para comparar y elegir) o crea uno
      m.on('click', () => { const ls = cityLodgings(plan, c.id, pid); ls.length ? editItemDialog(plan, ls[0]) : editItemDialog(plan, null, { rubro: 'alojamiento', cityId: c.id }); });
      m.bindTooltip(`<b>${i + 1}. ${esc(c.name)}</b>${c.from ? `<br>${fmtDay(c.from)} → ${c.to ? fmtDay(c.to) : '…'} · ${nightsOf(c)} noche${nightsOf(c) !== 1 ? 's' : ''}` : ''}${lodgTxt ? '<br>' + lodgTxt : ''}`, { direction: 'top', offset: [0, -10] });
    });
  };
  if (showOthers) plan.proposals.filter(p => p.id !== cur).forEach(p => drawProp(p.id, false));
  drawProp(cur, true);
  el.classList.add('labels');
  planMap.on('zoomend moveend', () => declutterPlanMap(el));
  setTimeout(() => declutterPlanMap(el), 50);
  if (view) planMap.setView(view.c, view.z);
  else if (bounds.length) planMap.fitBounds(L.latLngBounds(bounds).pad(0.15), { maxZoom: 9 });
  else planMap.setView([46, 5], 4);
  const lg = $('#planMapLegend');
  if (lg) lg.innerHTML = `<span>${MODE_ICON('avion')} vuelo (curva)</span><span>${MODE_ICON('bus')}${MODE_ICON('tren')}${MODE_ICON('auto')} por tierra</span><span><i class="lg-dot"></i> tramo con alternativas sin elegir</span>
    ${hasProps(plan) ? `<label class="check"><input type="checkbox" id="mapOthers" ${showOthers ? 'checked' : ''}> mostrar las otras propuestas (en gris)</label>` : ''}
    <span class="muted">Clic en un tramo o en una ciudad para ver y elegir sus alternativas (transporte o alojamiento).</span>`;
  $('#mapOthers') && ($('#mapOthers').onchange = e => { ui.plan.mapOthers = e.target.checked; drawPlanMap(plan); });
}

/* ---------- Informe del plan (para imprimir o guardar como PDF y compartir) ----------
   Se arma en una ventana aparte, con su propio estilo de impresión. Incluye todo: las propuestas,
   las alternativas (la elegida marcada con ✓) y un mapa por propuesta. */
function reportDialog(plan){
  const dlg = $('#dlg'), hp = hasProps(plan);
  dlg.innerHTML = `<form method="dialog" style="width:min(460px,86vw)"><h3>📄 Informe del plan</h3>
    <p class="small muted" style="margin-top:-4px">Se abre en una ventana nueva, lista para imprimir o <b>guardar como PDF</b> y mandarla.</p>
    ${hp ? `<div class="field"><label>Propuestas</label><select name="props">
      <option value="all">Todas (${plan.proposals.length}), con la comparación</option>
      <option value="cur">Solo la que estoy viendo (${esc(propName(plan, curProp(plan)))})</option>
      ${plan.chosenProposal ? `<option value="chosen">Solo la elegida (${esc(propName(plan, plan.chosenProposal))})</option>` : ''}</select></div>` : ''}
    <label class="check"><input type="checkbox" name="alts" checked> Incluir las alternativas que todavía no eligieron</label><br>
    <label class="check"><input type="checkbox" name="maps" checked> Incluir mapas del recorrido</label><br>
    <label class="check"><input type="checkbox" name="pend" checked> Incluir la lista de pendientes</label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Generar informe</button></div></form>`;
  dlg.showModal();
  // la ventana se abre en el mismo clic (si no, el navegador la puede bloquear)
  dlg.querySelector('button[value=ok]').addEventListener('click', ev => {
    ev.preventDefault();
    const f = dlg.querySelector('form');
    const which = f.elements.props?.value || 'all';
    const pids = !hp ? [null] : which === 'cur' ? [curProp(plan)] : which === 'chosen' ? [plan.chosenProposal] : plan.proposals.map(p => p.id);
    const opts = { pids, alts: f.elements.alts.checked, maps: f.elements.maps.checked, pend: f.elements.pend.checked, compare: hp && which === 'all' };
    dlg.close();
    showReport(plan, opts);
  });
}
/* vista previa del informe dentro de la app (no depende de que el navegador permita ventanas emergentes) */
function showReport(plan, opts){
  $('#reportView')?.remove();
  const html = buildReport(plan, { ...opts, embedded: true });
  const v = document.createElement('div'); v.id = 'reportView';
  v.innerHTML = `<div class="rv-bar"><b>📄 ${esc(plan.name)}</b>
      <button class="btn" id="rvPrint">🖨️ Imprimir / Guardar como PDF</button>
      <button class="btn sec" id="rvDl">⬇️ Descargar (.html)</button>
      <button class="btn sec" id="rvWin">↗ Abrir en otra ventana</button>
      <span class="small" style="opacity:.8">En la ventana de impresión elegí "Guardar como PDF" para tener el archivo y mandarlo.</span>
      <button class="btn sec" id="rvClose" style="margin-left:auto">✕ Cerrar</button></div>
    <iframe id="rvFrame" title="Informe del plan"></iframe>`;
  document.body.appendChild(v);
  const fr = $('#rvFrame'); fr.srcdoc = html;
  const fileName = `Plan ${plan.name}`.replace(/[\\/:*?"<>|]+/g, '-') + '.html';
  $('#rvPrint').onclick = () => { fr.contentWindow.focus(); fr.contentWindow.print(); };
  $('#rvDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buildReport(plan, opts)], { type: 'text/html' })); a.download = fileName; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#rvWin').onclick = () => { const w = window.open('', '_blank'); if (!w){ toast('El navegador bloqueó la ventana: usá "Imprimir" o "Descargar"'); return; } w.document.open(); w.document.write(buildReport(plan, opts)); w.document.close(); };
  $('#rvClose').onclick = () => v.remove();
  const esc_ = e => { if (e.key === 'Escape'){ v.remove(); document.removeEventListener('keydown', esc_); } }; document.addEventListener('keydown', esc_);
}

function reportMapData(plan, pid){
  const cities = pCities(plan, pid).filter(c => c.lat != null).sort((a, b) => (a.from || '').localeCompare(b.from || ''))
    .map((c, i) => ({ lat: c.lat, lon: c.lon, n: i + 1, name: c.name, nights: nightsOf(c) }));
  const legs = planLegs(plan, pid).filter(l => l.a && l.b).map(({ it, a, b }) => {
    const ch = chosenOpt(it), mode = ch?.mode || it.mode || it.options?.[0]?.mode || '', undecided = !ch && (it.options || []).length > 1;
    return { path: isFlight(mode) && !undecided ? arc(a, b) : [[a.lat, a.lon], [b.lat, b.lon]], flight: isFlight(mode), undecided };
  });
  return { cities, legs };
}

function buildReport(plan, o){
  const n = plan.travelers.length || 1, today = new Date().toISOString().slice(0, 10);
  const statusOf = it => ESTADOS.find(s => s.id === (it.status || 'presupuestado'));
  const stTag = it => `<span class="st ${statusOf(it).id}">${statusOf(it).label}</span>`;
  const ppOf = (it, op) => op.cost === '' || op.cost == null ? '–' : eur(optCost(plan, it, op).pp);
  const totOf = (it, op) => op.cost === '' || op.cost == null ? '–' : eur(optCost(plan, it, op).total);
  const cityName = id => plan.cities.find(c => c.id === id)?.name || '';
  // una tabla por rubro: la opción elegida y, debajo, las otras alternativas
  const rubroTable = (pid, rubro) => {
    const its = pItems(plan, pid).filter(i => i.rubro === rubro).sort((a, b) => itemSortKey(a).localeCompare(itemSortKey(b)));
    if (!its.length) return '';
    const r = RUBROS.find(x => x.id === rubro);
    const rows = its.map(it => {
      const ch = chosenOpt(it), opts = it.options || [], c = itemCost(plan, it);
      const name = esc(itemName(it)) + (it.cityId && rubro !== 'transporte' ? ` <span class="mut">· ${esc(cityName(it.cityId))}</span>` : '');
      const head = `<tr class="it"><td>${name}${it.notes ? `<div class="note">${esc(it.notes)}</div>` : ''}</td>
        <td>${ch ? `✓ <b>${esc(ch.label || 'elegida')}</b>${ch.mode ? ` · ${esc(ch.mode)}` : ''}<div class="mut">${esc(optWhen(it, ch))}</div>${ch.notes ? `<div class="note">${esc(ch.notes)}</div>` : ''}` : `<i>${opts.length} alternativas sin elegir</i>`}</td>
        <td class="num">${c.priced ? fmtRange(c.min.pp, c.max.pp) : '–'}</td><td class="num">${c.priced ? fmtRange(c.min.total, c.max.total) : '–'}</td><td>${stTag(it)}</td></tr>`;
      const others = o.alts ? opts.filter(op => !ch || op.id !== ch.id).filter(() => opts.length > 1) : [];
      return head + others.map(op => `<tr class="alt"><td></td><td>${ch ? '' : '○ '}${esc(op.label || 'opción')}${op.mode ? ` · ${esc(op.mode)}` : ''}<span class="mut"> ${esc(optWhen(it, op))}</span>${op.notes ? `<div class="note">${esc(op.notes)}</div>` : ''}</td>
        <td class="num">${ppOf(it, op)}</td><td class="num">${totOf(it, op)}</td><td class="mut">alternativa</td></tr>`).join('');
    }).join('');

  };

          <td>${ls.length ? ls.map(l => { const ch = chosenOpt(l); return ch ? `✓ ${esc(ch.label || l.title)}` : `<i>${l.options.length} opciones sin elegir</i>`; }).join('<br>') : (nightsOf(c) ? '<i class="warn">sin alojamiento</i>' : '–')}</td></tr>`; }).join('')}

      <div class="two">

        <div><h3>📊 Por rubro <span class="mut">— por persona</span></h3><table><tbody>

          <tr class="tot"><td>Total</td><td class="num">${fmtRange(t.ppMin, t.ppMax)}</td></tr></tbody></table></div>

  };
  const compare = o.compare ? (() => {
    const rows = plan.proposals.map(p => ({ p, t: planTotals(plan, p.id), d: propDates(plan, p.id), cs: pCities(plan, p.id).slice().sort((a, b) => (a.from || '').localeCompare(b.from || '')) }));
    const best = Math.min(...rows.map(r => r.t.ppMin));

        ${['transporte', 'alojamiento', 'actividad', 'diarios'].map(k => { const v = r.t.byRubro[k]; return `<td class="num">${v ? fmtRange(v.min / n, v.max / n) : '–'}</td>`; }).join('')}
        <td class="num"><b>${fmtRange(r.t.ppMin, r.t.ppMax)}</b>${Math.abs(r.t.ppMin - best) < 0.5 ? '<div class="mut">la más barata</div>' : ''}</td></tr>`).join('')}
      </tbody></table>`;
  })() : '';

  const mapsJson = JSON.stringify(maps).replace(/</g, '\\u003c');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(plan.name)} — plan de viaje</title>

</style></head><body>

  <div class="mut small">Informe generado el ${fmtDay(today)}${hasProps(plan) ? ` · ${plan.proposals.length} propuestas${plan.chosenProposal ? `, elegida: ${esc(propName(plan, plan.chosenProposal))}` : ', todavía sin elegir'}` : ''}</div></header>
${compare}
${body}
<footer>Precios en euros. "Por persona" divide cada ítem entre los viajeros que lo comparten. ${o.alts ? 'Debajo de cada ítem figuran las alternativas que no se eligieron.' : ''}</footer>
</div>
${o.maps ? `<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>
<script>
const MAPS = ${mapsJson};
let pending = MAPS.length;
const done = () => { if (--pending <= 0) document.getElementById('st').textContent = 'Listo para imprimir'; };
for (const m of MAPS){
  const el = document.getElementById(m.id); if (!el){ done(); continue; }
  const map = L.map(el, { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, attributionControl: true });
  const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri, © OpenStreetMap' }).addTo(map);
  let fired = false; const fin = () => { if (!fired){ fired = true; done(); } }; tiles.on('load', fin); setTimeout(fin, 6000);
  const pts = [];
  for (const l of m.legs){ L.polyline(l.path, { color: m.color, weight: 3, opacity: .85, dashArray: l.undecided ? '2 7' : l.flight ? '8 6' : null }).addTo(map); pts.push(...l.path); }
  if (!m.legs.length && m.cities.length > 1) L.polyline(m.cities.map(c => [c.lat, c.lon]), { color: m.color, weight: 2, dashArray: '4 6' }).addTo(map);
  for (const c of m.cities){ pts.push([c.lat, c.lon]);
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="pin"><i>' + c.n + '</i><span>' + c.name.replace(/</g, '&lt;') + (c.nights ? ' · ' + c.nights + ' n' : '') + '</span></div>' }) }).addTo(map); }
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.05), { maxZoom: 9, padding: [10, 10] }); else map.setView([46, 5], 4);
}
<\/script>` : ''}
</body></html>`;
